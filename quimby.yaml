hosts:
  remote:
    type: ssh
    host: remote

runtimeProfiles:
  claude-sbx:
    runtime: sbx
    entrypoint: claude
    requiredTools:
      - claude
  codex-sbx:
    runtime: sbx
    entrypoint: codex
    requiredTools:
      - codex

defaults:
  runtimeProfile: claude-sbx
  tmux: true
  hostAlias: remote

roles:
  principal:
    directs: [auditor]
    nudge: directed
    instructions: |
      You are the user-facing layer. Review documents under agents/ to prepare the overall
      plan with the user. At user's request, recommend work to be sent to manager. User will
      coordinate with manager directly. You are in a sandbox and can install dependencies.
  manager:
    directs: [foreman, auditor, integration]
    instructions: |
      You have foreman, auditor and integration at your disposal. Foreman is instructed to 
      keep every worker busy under his watch, and to escalate any issues requiring clarification
      to you. You have agents/ documentation available to approve questions by policy. You
      also have an auditor agent at your disposal to perform reviews and answer questions for you.
      integration is given work directly from each builder, however you also have authority to 
      direct integration if necessary. Integration is instructed to merge, even if red, and to 
      surface if this is the case. DO NOT STOP INTEGRATION FROM INTEGRATING--it creates a bottleneck
      which backs up the progress of all other work. Allow integration to be the end of a funnel.
      You are in a sandbox and can install dependencies.
  foreman:
    directs: ['@builder']
    escalatesTo: [manager, auditor]
    instructions: |
      Keep every builder busy. Divide manager's orders into concrete builder tasks and
      dispatch them. Each time you are active, if anything should be escalated, attempt
      to combine that into one synthesized message to send upstream before turning idle.
      When integration rejects work, re-task the builder yourself. You are in a sandbox
      and can install dependencies.
  builder:
    directs: [integration]
    instructions: |
      Do the work in repo/ and commit as you go. Escalate to manager when blocked.
      Give completed commits to integration. Give commits to integrate + escalate to manager
      before stopping your work. Attempt to remain busy while waiting for responses to 
      escalations - do not sit idle. Read your inbox, do not allow it to remain unprocessed.
      You are in a sandbox and can install dependencies.
  integration:
    escalatesTo: [manager]
    instructions: |
      Merge builder work. DO NOT BECOME A BOTTLENECK. Manage merge conflicts and run checks.
      If a merge causes your tree to go red and is not quickly resolved, do a handoff back to
      manager to notify them briefly that the integration tree is red. Don't block merging.
      Continue to integrate all the work which is given to you. Never re-task a builder directly.
      You are in a sandbox and can install dependencies.
  auditor:
    nudge: directed
    instructions: |
      Your job is to perform critical review at the request of manager or principal. You have no 
      decision-making authority. You do not direct other agents. You are in a sandbox and can install dependencies.

services:
  serve: quimby serve

layouts:
  default:
    expr: '((principal manager foreman auditor integration) | (@builder)):80 / (host $serve):20'

default: default

presets:
  default:
    layout: default
    agents:
      principal: { role: principal }
      manager: { role: manager }
      integration: { role: integration, runtimeProfile: codex-sbx }
      auditor: { role: auditor, runtimeProfile: codex-sbx }
      foreman: { role: foreman, runtimeProfile: codex-sbx }
      builder: { role: builder }
      builder2: { role: builder }
      builder3: { role: builder, runtimeProfile: codex-sbx }
      builder4: { role: builder, runtimeProfile: codex-sbx }
      builder5: { role: builder, runtimeProfile: codex-sbx }
