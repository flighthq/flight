hosts:
  remote:
    type: ssh
    host: remote

runtimeProfiles:
  claude-sbx:
    runtime: sbx
    entrypoint: claude
    requiredTools:
      - claude
  codex-sbx:
    runtime: sbx
    entrypoint: codex
    requiredTools:
      - codex

defaults:
  runtimeProfile: claude-sbx
  tmux: true
  hostAlias: remote

roles:
  chief: # you talk to this one; only manager and critic reach it
    directs: [manager, critic]
    nudge: directed
  manager: # the hot loop — absorbs everything, keeps the builders fed
    directs: ['@builder', integration]
    nudge: all
  builder:
    nudge: all
  integration:
    nudge: all
  critic: # advisory only; directs nobody, so it never becomes a second boss
    nudge: directed

services:
  serve: quimby serve

layouts:
  default:
    expr: '((chief manager) | (@builder integration critic)):80 / (host $serve):20'

default: default

presets:
  default:
    layout: default
    agents:
      chief: { role: chief }
      manager: { role: manager }
      integration: { role: integration }
      critic: { role: critic, runtimeProfile: codex-sbx }
      builder: { role: builder }
      builder2: { role: builder }
      builder3: { role: builder, runtimeProfile: codex-sbx }
      builder4: { role: builder, runtimeProfile: codex-sbx }
