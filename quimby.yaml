hosts:
  remote:
    type: ssh
    host: remote

runtimeProfiles:
  claude-sbx:
    runtime: sbx
    entrypoint: claude
    requiredTools:
      - claude
  codex-sbx:
    runtime: sbx
    entrypoint: codex
    requiredTools:
      - codex

defaults:
  runtimeProfile: claude-sbx
  tmux: true
  hostAlias: remote

roles:
  review: {}
  builder: {}
  integration: {}

services:
  serve: quimby serve

layouts:
  default:
    expr: ((review review2) | (builder builder2 builder3 builder4)):80 / (host $serve):20

default: default

presets:
  default:
    layout: default
    agents:
      review:
        role: review
        directs: [builder, builder2, builder3, builder4, review2]
        nudge: always
      review2:
        role: review
        nudge: always
        runtimeProfile: codex-sbx
      builder:
        role: builder
        nudge: always
      builder2:
        role: builder
        nudge: always
      builder3:
        role: builder
        nudge: always
        runtimeProfile: codex-sbx
      builder4:
        role: builder
        nudge: always
        runtimeProfile: codex-sbx
