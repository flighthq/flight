<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particle Editor</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        background: #111;
        color: #eee;
      }
      #control-panel {
        position: fixed;
        z-index: 2;
        top: 12px;
        right: 12px;
        width: min(280px, calc(100vw - 24px));
        max-height: calc(100vh - 76px);
        overflow-y: auto;
        overscroll-behavior: contain;
        border: 1px solid #363653;
        border-radius: 10px;
        background: #1a1a2eee;
        box-shadow: 0 12px 36px #0008;
      }
      #control-panel summary {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 10px 12px;
        cursor: pointer;
        background: #24243cee;
        color: #f0f0ff;
        font-size: 13px;
        font-weight: 700;
      }
      #controls {
        padding: 12px;
      }
      #controls h3 {
        margin: 14px 0 6px;
        font-size: 13px;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      #controls h3:first-child {
        margin-top: 0;
      }
      #controls label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 4px 0 1px;
        font-size: 12px;
      }
      #controls input[type='range'] {
        width: 100%;
        margin: 0 0 4px;
      }
      #controls .value {
        font-size: 11px;
        color: #888;
        font-variant-numeric: tabular-nums;
        min-width: 40px;
        text-align: right;
      }
      #controls select {
        width: 100%;
        margin: 0 0 4px;
        background: #222;
        color: #eee;
        border: 1px solid #444;
        padding: 2px 4px;
        font-size: 12px;
      }
      #controls input[type='color'] {
        width: 40px;
        height: 20px;
        border: 1px solid #444;
        background: none;
        padding: 0;
        cursor: pointer;
      }
      canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
      }
    </style>
  </head>
  <body>
    <details id="control-panel" open>
      <summary>Particle editor controls</summary>
      <div id="controls"></div>
    </details>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
