<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Material Showcase</title>
    <style>
      :root {
        color: #edf3ff;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #070a11;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
      }

      .controls {
        position: fixed;
        top: 18px;
        right: 18px;
        width: 230px;
        max-width: calc(100vw - 36px);
        max-height: calc(100vh - 36px);
        box-sizing: border-box;
        padding: 16px;
        border: 1px solid rgb(158 190 255 / 24%);
        border-radius: 14px;
        background: rgb(8 13 24 / 88%);
        box-shadow: 0 16px 50px rgb(0 0 0 / 35%);
        backdrop-filter: blur(14px);
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .controls h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }

      .controls p {
        margin: 0 0 14px;
        color: #93a4c3;
        font-size: 11px;
        line-height: 1.45;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-top: 12px;
      }

      .field label {
        display: flex;
        justify-content: space-between;
        color: #c8d5ec;
        font-size: 11px;
      }

      select,
      input {
        width: 100%;
        box-sizing: border-box;
        accent-color: #6ee7ff;
      }

      select,
      input[type='color'] {
        min-height: 34px;
        border: 1px solid #31405d;
        border-radius: 7px;
        color: #edf3ff;
        background: #111a2c;
      }

      .hint {
        margin-top: 14px !important;
        padding-top: 12px;
        border-top: 1px solid rgb(158 190 255 / 15%);
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
