<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spring Animation</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #dfe5ec;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
      }
      .controls {
        position: fixed;
        z-index: 2;
        top: 12px;
        right: 12px;
        width: min(218px, calc(100vw - 24px));
        max-height: calc(100vh - 76px);
        display: grid;
        gap: 6px;
        padding: 12px;
        overflow-y: auto;
        border: 1px solid #c5ced9;
        border-radius: 10px;
        background: #fffffff2;
        box-shadow: 0 10px 30px #2635482b;
        color: #314156;
        font-size: 12px;
      }
      .controls button {
        padding: 6px 8px;
        cursor: pointer;
        border: 1px solid #bcc8d5;
        border-radius: 5px;
        background: #f8fbff;
        color: #314156;
        text-align: left;
      }
      .controls button:hover {
        border-color: #2196f3;
      }
      .info {
        color: #68788d;
        font-variant-numeric: tabular-nums;
      }
      .legend {
        display: grid;
        gap: 3px;
        padding-top: 6px;
        border-top: 1px solid #dce3eb;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
