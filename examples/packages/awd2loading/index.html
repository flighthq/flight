<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWD2 Loading</title>
    <style>
      :root {
        color: #edf5ff;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #07101b;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
      }

      .details {
        position: fixed;
        top: 20px;
        left: 20px;
        width: 280px;
        box-sizing: border-box;
        padding: 18px;
        border: 1px solid rgb(100 210 255 / 28%);
        border-radius: 14px;
        background: rgb(6 15 28 / 88%);
        box-shadow: 0 18px 50px rgb(0 0 0 / 34%);
        backdrop-filter: blur(14px);
      }

      .details h1 {
        margin: 0 0 6px;
        font-size: 20px;
      }

      .details p {
        margin: 7px 0 0;
        color: #98abc4;
        font-size: 12px;
        line-height: 1.5;
      }

      .details strong {
        color: #72dcff;
        font-weight: 650;
      }

      .details .success {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid rgb(126 198 255 / 16%);
        color: #82f0c0;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
