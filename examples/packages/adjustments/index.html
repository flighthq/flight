<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Adjustments</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #1a1a2e;
      }
      canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
      }
      .controls {
        position: fixed;
        z-index: 2;
        top: 14px;
        left: max(14px, calc(50% - 386px));
        width: min(390px, calc(100vw - 28px));
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 10px 12px;
        border: 1px solid #39405e;
        border-radius: 9px;
        background: #111426ee;
        box-shadow: 0 10px 30px #0007;
        color: #d8def2;
        font: 12px monospace;
      }
      .field {
        display: grid;
        grid-template-columns: 88px minmax(90px, 1fr) 48px;
        gap: 8px;
        align-items: center;
      }
      .field input {
        width: 100%;
        min-width: 0;
        accent-color: #eedd44;
      }
      .value {
        color: #eedd44;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
