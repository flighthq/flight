[package]
name = "flight-preferences"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Key/value storage, namespaced access, boolean/number/JSON parsing, batch mutations, migration and change signals over host capabilities"
autotests = false

[lib]
doctest = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
flight-entity = { workspace = true }
flight-host = { workspace = true }
flight-permissions = { workspace = true }
flight-signals = { workspace = true }
serde = { version = "1" }
serde_json = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
flight-entity = { workspace = true }
flight-host = { workspace = true }
flight-permissions = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

[lints]
workspace = true
