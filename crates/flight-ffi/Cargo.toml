[package]
name = "flight-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "C FFI surface for Flight SDK — generated at build time from pub fn signatures"
publish = false
autotests = false

[lib]
crate-type = ["cdylib", "staticlib"]
doctest = false

[[test]]
name = "tests"
path = "tests/main.rs"

[[bin]]
name = "flight-offsets"
path = "src/bin/offsets.rs"

[features]
# Noop-backend WGPU state and target producers standing in for the host seam that supplies them,
# for live C tests of the render pass bracket. Never part of the default library or header.
stand-in-wgpu-host = ["dep:wgpu"]
# Links and scans flight-host-headless: an opaque headless host and the device, capability,
# surface and render-target carriers it lends, in the header's FLIGHT_HOST_HEADLESS section.
host-headless = ["dep:flight-host-headless"]

[dependencies]
flight-host-headless = { path = "../flight-host-headless", version = "0.6.0", optional = true }
flight-sdk = { workspace = true }
serde_json = { version = "1", default-features = false, features = ["std"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "noop"], optional = true }

[dev-dependencies]
cc = "1.11.2"
quote = "1"
syn = { version = "2", features = ["fold", "full", "visit"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "noop"] }

[build-dependencies]
quote = "1"
syn = { version = "2", features = ["fold", "full", "visit"] }

[lints]
workspace = true
