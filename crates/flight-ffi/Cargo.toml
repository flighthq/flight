[package]
name = "flight-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "C FFI surface for Flight SDK — generated at build time from pub fn signatures"
publish = false
autotests = false

[lib]
crate-type = ["cdylib", "staticlib"]
doctest = false

[[test]]
name = "tests"
path = "tests/main.rs"

[[bin]]
name = "flight-offsets"
path = "src/bin/offsets.rs"

[dependencies]
flight-sdk = { workspace = true }

[dev-dependencies]
cc = "1.11.2"

[build-dependencies]
syn = { version = "2", features = ["full", "visit"] }

[lints]
workspace = true
