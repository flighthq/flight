[package]
name = "flight-host-sdl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "SDL3 native window, input, GL and wgpu capability provider for Flight"
publish = false

[dependencies]
flight-app = { workspace = true }
flight-entity = { workspace = true }
flight-geometry = { workspace = true }
flight-host = { workspace = true }
flight-input = { workspace = true }
flight-lifecycle = { workspace = true }
flight-render-gl = { workspace = true }
flight-render-wgpu = { workspace = true }
flight-screen = { workspace = true }
flight-surface = { workspace = true }
futures = "0.3"
raw-window-handle = "0.6.2"
sdl3 = { version = "=0.22.1", default-features = false, features = ["build-from-source-static", "raw-window-handle"] }
wgpu = { version = "30.0.1", default-features = true, features = ["std", "wgsl"] }

[dev-dependencies]
flight-bitmap = { workspace = true }
flight-node = { workspace = true }
flight-render = { workspace = true }
flight-scene2d = { workspace = true }
flight-scene2d-gl = { workspace = true }
flight-scene2d-wgpu = { workspace = true }
flight-shape = { workspace = true }
flight-signals = { workspace = true }
flight-texture = { workspace = true }
glow = "0.18.0"

[[test]]
name = "i3_sdl_gl_test"
harness = false

[[test]]
name = "i3_sdl_reference_test"
harness = false

[[test]]
name = "i3_sdl_wgpu_test"
harness = false

[[test]]
name = "sdl_host_test"
harness = false

[lints]
workspace = true
