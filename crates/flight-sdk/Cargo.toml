[package]
name = "flight-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Flight SDK: every SDK crate's public lane in one dependency (TS @flighthq/sdk)"
autotests = false

[features]
default = ["gl", "wgpu"]
# The native render backends are the heavy part of a build; leave a feature off to skip it.
gl = ["dep:flight-effects-gl", "dep:flight-render-gl", "dep:flight-scene2d-gl", "dep:flight-scene3d-gl"]
wgpu = ["dep:flight-effects-wgpu", "dep:flight-render-wgpu", "dep:flight-scene2d-wgpu", "dep:flight-scene3d-wgpu"]

[lib]
doctest = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
