[package]
name = "flight-host-audio-codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Rust-native WAV and Ogg Vorbis decode provider for Flight audio"
publish = false
autotests = false

[features]
default = ["ogg", "wav"]
ogg = ["dep:lewton", "dep:ogg"]
wav = ["dep:hound"]

[lib]
doctest = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
flight-audio = { workspace = true }
flight-entity = { workspace = true }
flight-host = { workspace = true }
flight-stream = { workspace = true }
hound = { version = "=3.5.1", optional = true }
lewton = { version = "=0.10.2", default-features = false, features = ["ogg"], optional = true }
ogg = { version = "=0.8.0", optional = true }

[lints]
workspace = true
