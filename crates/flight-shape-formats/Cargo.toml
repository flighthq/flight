[package]
name = "flight-shape-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native JSON codec and shared command schemas for retained flight-shape streams"
autotests = false

[lib]
doctest = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
flight-entity = { workspace = true }
flight-geometry = { workspace = true }
flight-path = { workspace = true }
flight-registry = { workspace = true }
flight-shape = { path = "../flight-shape" }
flight-texture = { workspace = true }
serde_json = { version = "1", default-features = false, features = ["std", "preserve_order"] }

[lints]
workspace = true
