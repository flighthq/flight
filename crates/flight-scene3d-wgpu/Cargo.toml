[package]
name = "flight-scene3d-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "WebGPU 3D scene rendering: material renderers, shader pipelines, environment maps, shadow maps, and particle emitters for the wgpu backend"
autotests = false

[lib]
doctest = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
bytemuck = "1.25.2"
flight-bitmap = { workspace = true }
flight-camera = { workspace = true }
flight-color = { workspace = true }
flight-entity = { workspace = true }
flight-geometry = { workspace = true }
flight-image = { workspace = true }
flight-lighting = { workspace = true }
flight-log = { workspace = true }
flight-materials = { workspace = true }
flight-meshgeometry = { workspace = true }
flight-node = { workspace = true }
flight-particleemitter = { workspace = true }
flight-registry = { workspace = true }
flight-render = { workspace = true }
flight-render-wgpu = { workspace = true }
flight-requirement = { workspace = true }
flight-scene2d-wgpu = { workspace = true }
flight-scene3d = { workspace = true }
flight-shading = { workspace = true }
flight-signals = { workspace = true }
flight-texture = { workspace = true }
flight-textureatlas = { workspace = true }
flight-video = { workspace = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }

[dev-dependencies]
flight-host = { workspace = true }
futures = "0.3"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "noop"] }

[lints]
workspace = true
