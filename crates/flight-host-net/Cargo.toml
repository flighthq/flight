[package]
name = "flight-host-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Native HTTP host: fills the net capability with a blocking HTTP client on per-request worker threads, usable from any async executor"
autotests = false

[lib]
doctest = false

[[test]]
name = "tests"
path = "tests/main.rs"

[features]
default = ["https"]
# HTTPS through rustls with the ring crypto provider and bundled web PKI roots.
https = ["ureq/rustls"]

[dependencies]
flight-buffer = { workspace = true }
flight-entity = { workspace = true }
flight-host = { workspace = true }
flight-net = { workspace = true }
flight-signals = { workspace = true }
flight-stream = { workspace = true }
serde_json = { version = "1" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ureq = { version = "3.5.2", default-features = false }

[lints]
workspace = true
