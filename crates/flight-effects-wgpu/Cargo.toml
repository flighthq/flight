[package]
name = "flight-effects-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "WebGPU shader recipes for render effects over native wgpu (substrate-agnostic post-process pipeline)"
autotests = false

[lib]
doctest = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
flight-adjustments = { workspace = true }
flight-bitmap = { workspace = true }
flight-color = { workspace = true }
flight-effects = { workspace = true }
flight-entity = { workspace = true }
flight-log = { workspace = true }
flight-registry = { workspace = true }
flight-render = { workspace = true }
flight-render-wgpu = { workspace = true }
flight-texture = { workspace = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }

[dev-dependencies]
flight-host = { workspace = true }
flight-surface = { workspace = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "noop"] }

[lints]
workspace = true
