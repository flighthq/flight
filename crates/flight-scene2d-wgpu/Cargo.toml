[package]
name = "flight-scene2d-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Native wgpu-backed WebGPU display-object renderers (bitmap, shape, sprite, text, tilemap, particles)"
autotests = false

[lib]
doctest = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
bytemuck = "1.25.2"
flight-bitmaptext = { workspace = true }
flight-clip = { workspace = true }
flight-color = { workspace = true }
flight-entity = { workspace = true }
flight-geometry = { workspace = true }
flight-host = { workspace = true }
flight-image = { workspace = true }
flight-log = { workspace = true }
flight-materials = { workspace = true }
flight-node = { workspace = true }
flight-particleemitter = { workspace = true }
flight-path = { workspace = true }
flight-quadbatch = { workspace = true }
flight-registry = { workspace = true }
flight-render = { workspace = true }
flight-render-wgpu = { workspace = true }
flight-scene2d = { workspace = true }
flight-shape = { workspace = true }
flight-surface = { workspace = true }
flight-text = { workspace = true }
flight-textformat = { workspace = true }
flight-textinput = { workspace = true }
flight-textlayout = { workspace = true }
flight-texture = { workspace = true }
flight-textureatlas = { workspace = true }
flight-tilemap = { workspace = true }
flight-velocity = { workspace = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }

[dev-dependencies]
flight-signals = { workspace = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "noop"] }

[lints]
workspace = true
