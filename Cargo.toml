[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
authors = ["Joshua Granick and other Flight contributors"]

[workspace.lints.clippy]
needless_return = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

