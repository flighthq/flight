[workspace]
members = ["crates/*"]
exclude = ["tools/host-probe/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
authors = ["Joshua Granick and other Flight contributors"]
repository = "https://github.com/flighthq/flight"
homepage = "https://github.com/flighthq/flight"

[workspace.lints.clippy]
needless_return = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

