# swf: exports where the shared classifier gets it wrong.
#
# The public lane is what an application decides: which tag families to register, the entry points that
# read a document, and the readers for the sub-structures a caller may want on their own. Everything the
# importer needs to assemble itself out of — the bounded reader's primitives, the node builders, the tag
# walk, the flat dispatch table — is intra-SDK machinery a family module reaches by relative path and
# nobody else should reach at all.

protected:
  # The byte-level and node-level layers the families are composed from. A user registers a family; they
  # do not read a SWF RECT or build a SWF display object themselves, and exposing these as app API would
  # make every one of them a compatibility surface for a decomposition that is still being shaped.
  - file: src/swfAppearance.ts
  - file: src/swfBoundedDefinition.ts
  - file: src/swfImageTexture.ts
  - file: src/swfNode.ts
  - file: src/swfPrimitive.ts
  - file: src/swfTimelineParse.ts

  # Fixture builders for this package's own tests and its siblings'. Never app API.
  - file: src/swfFrameActionTestHelper.ts
  - file: src/swfTagStreamTestHelper.ts

  # Dispatch infrastructure. An application names handlers in `SwfParseOptions.tags` and the importer
  # expands them itself, so this is how the importer reads what it was handed, not an app-facing call.
  - expandSwfTagHandlerDispatch

  # Construction initializers. The paired `create*` is the app-facing half of each.
  - initializeSwfDocumentImport
  - initializeTimelineAudioCue
  - initializeTimelineStreamAudioCue
