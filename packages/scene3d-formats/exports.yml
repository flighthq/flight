# scene3d-formats: exports where the shared classifier gets it wrong.

protected:
  - collectAwd2BlockCounts
  - getAwd2BlockName
  - parseAwd2Requirements
  - AWD2_REQUIREMENT_KEY_NAMESPACE
  - GltfAnimationsCoreFeatureHandler
  - GltfAnisotropyExtensionHandler
  - GltfCamerasCoreFeatureHandler
  - GltfClearcoatExtensionHandler
  - GltfEmissiveStrengthExtensionHandler
  - GltfIorExtensionHandler
  - GltfIridescenceExtensionHandler
  - GltfPunctualLightsExtensionHandler
  - GltfSheenExtensionHandler
  - GltfSkinsCoreFeatureHandler
  - GltfSpecularExtensionHandler
  - GltfSpecularGlossinessExtensionHandler
  - GltfTransmissionExtensionHandler
  - GltfUnlitExtensionHandler
  - GltfVolumeExtensionHandler
  # Dispatch infrastructure. An application names handlers in `Awd2ParseOptions.blocks` and the importer
  # expands them itself, so this is how the importer reads what it was handed, not an app-facing call.
  - expandAwd2BlockDispatch
  # Construction initializers. The paired create* is the app-facing half of each.
  - initializeAwd2ParseState
  # STL fixture writers. Test-only: they build the two encodings of one model so the parity assertions cannot
  # drift apart, which is contract-lane business and nothing an application imports.
  - buildAsciiStl
  - buildBinaryStl
  - STL_SQUARE_FACETS
  # COLLADA's shared XML and scene primitives. Contract-lane only: they are the plumbing the orchestrator and the
  # feature decoders both read, not something an application calls — and names this generic have no business in the
  # public SDK vocabulary even scoped to the format.
  - colladaChild
  - colladaChildren
  - colladaDescendants
  - colladaIdOf
  - colladaLocalName
  - colladaNumbers
  - colladaText
  - parseColladaFloats
  - walkColladaElement
  - applyColladaBindMaterial
  - applyColladaMaterialOverrides
  - buildColladaNodeWorldMatrices
  - parseColladaBindMaterial
  - resolveColladaPrimitiveSymbols
