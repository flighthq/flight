  - applyCanvasGradientRampLookup
  - buildCanvasGradientRamp
  - clipCanvasBevelBand
  - unregisterCanvasBlendEffectBackdrop
  - acquireCanvasRenderTarget
  - applyBevelEffectToCanvas
