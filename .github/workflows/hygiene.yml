name: Hygiene

# Repository hygiene on every push and PR — and it NEVER fails. CI (tests.yml) answers "is this a
# working product for users"; these checks answer "is the repo tidy": the whole-repo typecheck,
# lint, format (TS + Rust), clippy, ordering, convention audits, generated-manifest and ratchet
# checks, the scripts and dev-tool suites, and the advisory bundle-size report. A stale count or an unregenerated manifest
# is worth knowing about but is not a broken product, so it must not turn a commit red.
#
# Every check step is `continue-on-error`, which keeps the JOB green (a job-level continue-on-error
# would still publish a red check run, and GitHub marks the commit red for any red check). The last
# step of each job turns the failed steps into `::warning` annotations and a run-summary table, so a
# failure is visible on the run without failing it. Format also blocks locally in the pre-push hook,
# which checks it first.
#
# The same gates still run where they are cheap to fix: `npm run check` locally runs every gate, the
# pre-commit hook lints and formats staged files, and agents run the relevant checks at their
# checkpoints (AGENTS.md).

# No path filtering, as in CI: every check runs on every push, including Markdown-only ones, whose
# formatting is checked here too.
on:
  pull_request:
  push:
    # Develop only, like CI: main receives only commits already checked here.
    branches: [develop]
  workflow_dispatch:

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

# Nothing here publishes or gates, so a newer push always supersedes an older run.
concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust · format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
      - id: clippy
        continue-on-error: true
        run: cargo clippy --workspace
      - name: Report
        if: always()
        env:
          OUTCOMES: cargo-fmt=${{ steps.fmt.outcome }} clippy=${{ steps.clippy.outcome }}
        run: bash scripts/report-hygiene.sh

  # The whole-repo typecheck. In CI the build already type-checks every package and its tests, so
  # what this adds is examples, functional scenes, scripts, tools and conformance — none of it
  # shipped, and the examples still build and render in CI's smoke legs. The pre-push hook runs the
  # same typecheck and blocks on it, so a type error rarely gets this far.
  typecheck:
    name: TypeScript · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Report
        if: always()
        env:
          OUTCOMES: typecheck=${{ steps.typecheck.outcome }}
        run: bash scripts/report-hygiene.sh

  # The examples on every backend, as a WARNING. An example failing is as often an example not yet
  # updated for an API change as an SDK defect — upkeep, not a broken product — so it never fails the
  # run. SDK rendering itself is gated in CI by the functional scenes.
  examples:
    name: Render · examples${{ matrix.suffix }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ''
            args: --renderer=dom,canvas,webgl
          - suffix: ' · webgpu'
            args: --renderer=webgpu --parallel 1 --retries 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - id: harness
        name: Build the examples harness
        continue-on-error: true
        run: npm run build:examples
      - uses: ./.github/actions/setup-playwright
      # Sized for this runner as CI's render legs are: one SwiftShader adapter, so WebGPU serializes.
      - id: smoke
        name: Run the examples
        if: ${{ steps.harness.outcome == 'success' }}
        continue-on-error: true
        run: npm run test:examples:smoke -- ${{ matrix.args }}
        env:
          FLIGHT_CAPTURE_WORKER_COUNT: 2
          FLIGHT_CAPTURE_TIMEOUT_MS: 45000
      - name: Report
        if: always()
        env:
          OUTCOMES: examples-harness=${{ steps.harness.outcome }} examples-smoke=${{ steps.smoke.outcome }}
        run: bash scripts/report-hygiene.sh

  checks:
    name: TypeScript · lint, format, conventions
    runs-on: ubuntu-latest
    steps:
      # Full history: some invariant gates compare against earlier commits.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci

      - id: lint
        continue-on-error: true
        run: npm run check
        env:
          FLIGHT_CHECK_GATES: lint
      - id: format
        continue-on-error: true
        run: npm run format:check
      - id: conventions
        continue-on-error: true
        run: npm run check
        env:
          FLIGHT_CHECK_GATES: 'order:check,portable:check,mocks:check,backend-prefix:check,transport-bypasses:check'
      - id: invariants
        continue-on-error: true
        run: npm run check
        env:
          FLIGHT_CHECK_GATES: 'exports:check,reachability:check,type-home:check, backend-lifecycle:check,api:check, facets:check,catalog:check,support:check,instrumentation:check, fingerprint-computation-id:check,evidence:check,assertions:check, data-cast-colour:check,unit-test-cost:check, expected-image-descriptions:check,functional-antialiasing:check, degree-constants:check,capability-arrival:check,host-bypasses:check, mixed-absence:check,opaque-values:check,double-casts:check, capture provenance (advisory)'
      # Advisory by construction: `npm run size` always exits 0 and only reports which bundles moved
      # against the committed unminified baseline.
      - id: size
        continue-on-error: true
        run: npm run size
      # The shipping number: every dedicated tools/size fixture through terser, against its pin in
      # tools/size/size.baseline.json. About a minute. Examples may import whole-store conveniences, so
      # they are deliberately not the cost contract. A warning, not a gate: the pin's own remedy
      # (`size:minified:baseline`) erases whatever a gate objected to, so a red gate mostly bought a
      # rewritten pin.
      - id: size-minified
        continue-on-error: true
        run: npm run size:minified
      - id: api
        continue-on-error: true
        run: |
          npm run api
          npm run api:json

      - name: Report
        if: always()
        env:
          OUTCOMES: 'lint=${{ steps.lint.outcome }} format=${{ steps.format.outcome }} conventions=${{ steps.conventions.outcome }} invariants=${{ steps.invariants.outcome }} size=${{ steps.size.outcome }} size-minified=${{ steps.size-minified.outcome }} api=${{ steps.api.outcome }}'
        run: bash scripts/report-hygiene.sh

  scripts:
    name: Scripts · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - id: scripts
        continue-on-error: true
        run: npm run test:scripts
      - name: Report
        if: always()
        env:
          OUTCOMES: scripts=${{ steps.scripts.outcome }}
        run: bash scripts/report-hygiene.sh

  tools:
    name: Dev tools · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: ./.github/actions/setup-playwright
      - id: tools
        continue-on-error: true
        run: npm run test:tools
      - name: Report
        if: always()
        env:
          OUTCOMES: tools=${{ steps.tools.outcome }}
        run: bash scripts/report-hygiene.sh
