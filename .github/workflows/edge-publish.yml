name: Edge publish

# Publishes the `edge` snapshot for a commit Promote has just adopted as `main`.
#
# ★ WHY THIS WORKFLOW EXISTS AT ALL: A GITHUB_TOKEN PUSH CREATES NO WORKFLOW RUN.
# `promote.yml` fast-forwards main with the default `GITHUB_TOKEN`, and GitHub deliberately does not
# start a workflow run from events raised by that token — the recursion guard. So `tests.yml` never
# fires on `main`, its `edge-publish` job never runs there, and the `edge` dist-tag silently stops
# advancing. Nothing reports this: there is no failed run to look at, only an absence.
#
# ★ WHY `workflow_dispatch` AND NOT `workflow_run`. `workflow_run` chains off a *run*, and the whole
# problem is that no run is created. `workflow_dispatch` and `repository_dispatch` are the two
# documented exceptions to the recursion guard — GITHUB_TOKEN CAN raise them — so an explicit dispatch
# is the one mechanism that closes the gap without a new credential. A PAT or GitHub App would also
# work and is deliberately not used: it means a long-lived secret whose only purpose is to defeat a
# guard the platform already exempts this event from.
#
# THIS FILE MUST LIVE ON THE DEFAULT BRANCH (`main`) TO BE DISPATCHABLE, for the same reason
# promote.yml documents: Actions registers `workflow_dispatch` from the default branch only.
#
# ★ FIRST ROLLOUT IS NOT SELF-STARTING, AND THE FIRST PROMOTION MUST NOT BE ASSUMED PUBLISHED.
# This workflow becomes dispatchable only once it is ON main. The promotion that CARRIES it to main is
# therefore the one promotion that cannot dispatch it: at the moment `promote.yml` runs its dispatch
# step, main does not yet have the file registered, and `gh workflow run edge-publish.yml` fails with
# "could not find any workflows named edge-publish.yml".
#
# That failure is loud, not silent — the dispatch step is fail-closed, so the promotion goes RED and
# says so. Which is the correct behaviour and also the trap: the red is expected exactly once, and an
# operator who dismisses it as a rollout artifact will also have skipped the edge publish for that
# commit without noticing. THE FIRST PROMOTION AFTER THIS LANDS PUBLISHES NOTHING TO `edge`.
#
# The one-time bootstrap, to be performed by a human and NOT automated (an auto-retry here would hide
# the very case that needs looking at):
#
#   1. Land promote.yml + edge-publish.yml on `main` — through the normal promotion, whose dispatch
#      step is expected to fail. Record that run; it is the known-red one.
#   2. Confirm the workflow is registered: `gh workflow list` should now show "Edge publish".
#   3. Dispatch it once, by hand, for the commit main now points at:
#        gh workflow run edge-publish.yml --ref main -f sha="$(git rev-parse origin/main)"
#      Watch that run to completion. This is the visible, deliberate act that closes the gap the
#      failed step left, and it exercises the whole receiver path once before anything depends on it.
#   4. Verify the channel actually moved — `npm dist-tag ls @flighthq/sdk` should show `edge` at the
#      version this run published. That check is the real acceptance for the whole mechanism; every
#      local gate up to here proves only that the wiring is right, never that a package was published.
#   5. From the NEXT promotion onward the dispatch is automatic and no further manual step exists.
#
# A staged alternative, if the red promotion is unacceptable: land edge-publish.yml on main FIRST, on
# its own, and only then land the promote.yml dispatch step. The receiver is inert until something
# dispatches it, so shipping it early costs nothing and removes the known-red run entirely. This is the
# safer order and is preferred where the branch protection allows two passes.
run-name: Edge publish · ${{ inputs.sha }} · from promote run ${{ inputs.promote_run_id }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The exact promoted commit to publish. Must already be on main.
        required: true
        type: string
      promote_run_id:
        description: The promote.yml run that dispatched this, for run correlation.
        required: false
        type: string
        default: ''

concurrency:
  # ★ CHANNEL-GLOBAL, NOT CANDIDATE-KEYED. `edge` is ONE npm dist-tag and every publish stamps the
  # whole ~141-package graph to a single version, so two publishes are never independent work however
  # different their candidates are — they contend for the same pointer. A candidate-keyed group let two
  # promotions in the same minute publish CONCURRENTLY and race on that tag, and because a dist-tag is
  # last-write-wins the OLDER build could land on `edge` and stay there. Serializing per channel is the
  # only key that makes the tag's final value a function of promotion order.
  #
  # Retries and duplicate dispatches of one candidate are handled by the publisher being idempotent per
  # package, not by the concurrency key. Never cancel mid-publish: a cancelled run leaves the graph
  # half-published.
  group: edge-publish-main
  cancel-in-progress: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  publish:
    name: Publish edge snapshot for ${{ inputs.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read tests.yml run conclusions for the dispatched sha
      id-token: write # npm provenance
    steps:
      # ★ CHECK OUT THE INPUT, THEN VERIFY IT. The sha arrives as a dispatch input, which is caller-
      # supplied data — this workflow is dispatchable by hand as well as by promote.yml. Everything
      # below re-establishes from the repository what the input only claims.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          # edge-version derives its sortable build number from `git rev-list --count`, and the
          # ancestry check below needs origin/main.
          fetch-depth: 0

      - name: Verify the checkout is the dispatched commit and is on main
        env:
          CANDIDATE: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          # `actions/checkout` resolves a ref; assert what it actually landed on rather than assuming.
          head=$(git rev-parse HEAD)
          if [ "$head" != "$CANDIDATE" ]; then
            echo "::error::checkout resolved to ${head}, not the dispatched ${CANDIDATE}; refusing to publish a commit nobody asked for."
            exit 1
          fi

          # The edge channel means "what main points at". A commit that is not on main — a develop-only
          # commit, or one promotion has not adopted — must not be published under that tag, however it
          # was dispatched.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$CANDIDATE" refs/remotes/origin/main; then
            echo "::error::${CANDIDATE} is not an ancestor of origin/main; edge publishes only commits main has adopted."
            exit 1
          fi
          echo "${CANDIDATE} is on main and checked out."

      # The same gate release.yml applies to a tag: prove THIS tree passed CI. Promote already resolved
      # the candidate from green runs, but this workflow is independently dispatchable, so it re-proves
      # it rather than trusting the caller. Absence of a run is never treated as green.
      - name: Verify the dispatched commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          ci_result=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?head_sha=${CANDIDATE}" \
            --jq '[.total_count, ([.workflow_runs[] | select(.conclusion == "success")] | length), ([.workflow_runs[] | (.conclusion // .status)] | join(", "))] | .[]')
          mapfile -t ci_fields <<<"${ci_result}"
          run_count=${ci_fields[0]:-0}
          success_count=${ci_fields[1]:-0}
          run_states=${ci_fields[2]:-unknown}

          if (( run_count == 0 )); then
            echo "::error::no tests.yml run exists for ${CANDIDATE}; refusing to publish an untested commit to edge."
            exit 1
          fi
          if (( success_count == 0 )); then
            echo "::error::tests.yml ran for ${CANDIDATE} but no run succeeded (states: ${run_states}); refusing to publish to edge."
            exit 1
          fi
          echo "tests.yml has a successful run for ${CANDIDATE}."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          # Writes an .npmrc pointing at public npm and wires NODE_AUTH_TOKEN for the publish.
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # tests.yml's edge-publish reuses its own run's `build` artifact. This workflow is a separate run
      # with no such artifact, so it builds the graph itself. That is the cost of decoupling the publish
      # from the run that tested the commit, and it is the reason the CI gate above is a hard check
      # rather than an inherited `needs:`.
      - run: npm run build

      # ★ AN EXPLICIT BRANCH ARGUMENT, BECAUSE THIS CHECKOUT IS DETACHED. edge-version falls back to
      # GITHUB_REF_NAME / the current git branch to pick the channel, and neither names `main` on a
      # detached checkout of a sha. Passing it explicitly is what keeps the dist-tag `edge` rather than
      # whatever the fallback happened to resolve.
      - name: Compute snapshot version and dist-tag
        id: edge
        run: npx tsx scripts/edge-version.ts main >> "$GITHUB_OUTPUT"

      # Exercise the same cumulative generator stable publication uses. npm has no release-notes
      # field, so the rendered note lives in the run summary rather than inside one package tarball.
      - name: Generate cumulative snapshot release notes
        env:
          SNAPSHOT_VERSION: ${{ steps.edge.outputs.version }}
        run: |
          set -euo pipefail
          npm run release:notes -- "${SNAPSHOT_VERSION}" --through HEAD --output "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md" >> "${GITHUB_STEP_SUMMARY}"

      # ★ IDEMPOTENCY IS THE PUBLISHER'S, PER PACKAGE — DO NOT REINTRODUCE AN OUTER SKIP.
      # `scripts/publish-packages.ts` already skips any package whose version is on the registry, so a
      # re-run after a partial failure completes the set across the ~141-package graph. That per-package
      # recovery is the whole point, and an outer guard destroys it: an earlier attempt that published
      # @flighthq/sdk and then died leaves the graph incomplete, while a check on `@flighthq/sdk@version`
      # reports "already published" and skips forever. The half-published state would then be permanent,
      # and the guard would be the reason.
      #
      # So the publisher always runs, on every dispatch, and decides package by package. A duplicated
      # dispatch is a fast no-op because every package is already present, not because we guessed from
      # one of them.
      - name: Stamp the graph to the snapshot version
        env:
          EDGE_VERSION: ${{ steps.edge.outputs.version }}
        run: npm run version:packages "${EDGE_VERSION}"
      - name: Publish snapshot to npm
        env:
          EDGE_TAG: ${{ steps.edge.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm run release -- --no-build --tag "${EDGE_TAG}"

      # Correlation in the direction that is fully supported: this run names the promote run that asked
      # for it, in `run-name` above and in the summary here. The reverse link is best-effort on the
      # promote side, because the dispatch API returns no run id.
      # ★ EVERY INTERPOLATED VALUE ARRIVES THROUGH `env`, INCLUDING IN THE MARKDOWN.
      # `${{ inputs.sha }}` written straight into a `run:` block is substituted before bash ever sees
      # the script, so a crafted input becomes shell source — and a Markdown table is still a shell
      # heredoc, not a safe context. Going through `env` puts the value in the process environment where
      # bash treats it as data, and every reference is quoted so word-splitting cannot reassemble it.
      - name: Record what was published
        if: ${{ always() }}
        env:
          CANDIDATE: ${{ inputs.sha }}
          EDGE_VERSION: ${{ steps.edge.outputs.version }}
          EDGE_TAG: ${{ steps.edge.outputs.tag }}
          PROMOTE_RUN_ID: ${{ inputs.promote_run_id }}
        run: |
          {
            echo "### Edge publish"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| candidate | \`${CANDIDATE}\` |"
            echo "| version | \`${EDGE_VERSION}\` |"
            echo "| dist-tag | \`${EDGE_TAG}\` |"
            echo "| dispatched by | promote run \`${PROMOTE_RUN_ID}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
