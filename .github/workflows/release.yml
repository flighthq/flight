name: Release

# On a version tag: publishes the whole @flighthq/* package graph to npm, then builds the examples
# site at that tag (source == published at the release commit, so it faithfully demonstrates the
# published SDK) and attaches it as a GitHub release asset the site repo serves at flighthq.ai/examples.
# On `develop`, run `npm run version:packages <version>`, commit, and push; wait for green CI.
# Tag that tested commit and push only the tag. `main` remains machine-managed by Promote.
on:
  push:
    # Bare numeric version tags (no "v" prefix), e.g. 0.1.0. The release asset is named after the tag.
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  actions: read # verify tests.yml passed for the exact tagged commit
  contents: write # create the GitHub release + upload the examples asset
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm and attach examples bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Writes an .npmrc pointing at public npm and wires NODE_AUTH_TOKEN for the publish.
          registry-url: https://registry.npmjs.org
      - name: Verify release ref is a tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::release workflow publishes from a version tag; got ${GITHUB_REF_TYPE} ref ${GITHUB_REF_NAME}"
            exit 1
          fi
      # Release deliberately verifies the tagged commit's CI directly rather than requiring Promote
      # to have adopted it as `main`: a newer green commit can legitimately advance main past this one.
      # Exact head_sha lookup also keeps an intentionally old tag from falling outside a recent-run window.
      - name: Verify tagged commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ci_result=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?head_sha=${GITHUB_SHA}" \
            --jq '[.total_count, ([.workflow_runs[] | select(.conclusion == "success")] | length), ([.workflow_runs[] | (.conclusion // .status)] | join(", "))] | .[]')
          mapfile -t ci_fields <<<"${ci_result}"
          run_count=${ci_fields[0]:-0}
          success_count=${ci_fields[1]:-0}
          run_states=${ci_fields[2]:-unknown}

          if (( run_count == 0 )); then
            echo "::error::no tests.yml run exists for tagged commit ${GITHUB_SHA}; push it to develop and wait for CI before releasing."
            exit 1
          fi
          if (( success_count == 0 )); then
            echo "::error::tests.yml ran for tagged commit ${GITHUB_SHA} but no run succeeded (states: ${run_states}); fix the build before releasing."
            exit 1
          fi
          echo "tests.yml has a successful run for tagged commit ${GITHUB_SHA}."
      - name: Verify release tag matches package version
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from 'node:fs';

          const versions = new Set(
            readdirSync('packages', { withFileTypes: true })
              .filter((entry) => entry.isDirectory())
              .map((entry) => `packages/${entry.name}/package.json`)
              .filter((path) => existsSync(path))
              .map((path) => JSON.parse(readFileSync(path, 'utf8')).version),
          );
          const manifestVersions = [...versions];
          if (manifestVersions.length !== 1 || manifestVersions[0] !== process.env.GITHUB_REF_NAME) {
            console.error(
              `tag ${process.env.GITHUB_REF_NAME} but manifests are at ${manifestVersions.join(', ')} — ` +
                `run \`npm run version:packages ${process.env.GITHUB_REF_NAME}\``,
            );
            process.exit(1);
          }
          NODE
      - run: npm ci
      - run: npm run build
      - name: Publish packages to npm
        run: npm run release -- --no-build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Attaches build provenance to each package (public repo + id-token: write above).
          NPM_CONFIG_PROVENANCE: 'true'

      # Examples site → GitHub release asset for the site repo's /examples route. Built at this tag,
      # where the workspace source is exactly the SDK version just published.
      - name: Build examples site
        run: npm run build:examples
        env:
          VITE_BASE: /examples/
      - name: Tarball examples dist (root-level, no wrapper dir)
        run: tar -czf "examples-dist-${GITHUB_REF_NAME}.tgz" -C examples/runners/web/dist .
      - name: Attach examples bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "examples-dist-${GITHUB_REF_NAME}.tgz" \
            --title "${GITHUB_REF_NAME}" --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" "examples-dist-${GITHUB_REF_NAME}.tgz" --clobber
