# Forwards a completed capture to `flight-oracles` as a fixed dispatch envelope.
# agents/render-oracle-repository.md §7 step 3.
#
# ★★ THIS IS THE PRIVILEGED HALF, AND IT NEVER EXECUTES THE COMMISSIONED CHECKOUT.
# It holds the credential that can open a pull request in another repository, so §7 requires it to be a
# separately triggered workflow that "does not execute the Flight checkout or extract candidate-controlled
# archives; it forwards only the fixed dispatch envelope and recorded digest."
#
# `workflow_run` is what enforces that. A `workflow_run` job runs the workflow file from the DEFAULT
# BRANCH, with a fresh context — not the commissioned commit's copy of it. So a request that lands
# malicious code changes what `oracle-capture` runs, and changes nothing about this file, this token, or
# this envelope. There is deliberately NO checkout step here, and deliberately no artifact download: this
# workflow never reads a byte the capture produced. It reads the run's metadata through the API and sends
# identifiers onward. Intake downloads and verifies the bytes itself, with its own separation of
# unprivileged extraction from privileged writing.
#
# ★ IF YOU ARE TEMPTED TO ADD `actions/download-artifact` HERE, THAT IS THE BOUNDARY BEING CROSSED.
# Extracting a candidate-controlled archive in the job that holds the cross-repository token is exactly
# the thing the split exists to prevent — an archive is attacker-controlled input, and this job's token
# can rewrite the store the candidate is being measured against.
# ★★ THIS FILE MUST LIVE ON THE REPOSITORY'S DEFAULT BRANCH (`main`) OR IT DOES NOT RUN AT ALL.
# GitHub registers `workflow_run` workflows only from the default branch: a copy on `develop` alone is
# invisible to Actions, never appears in the run list, and reports no error — the capture succeeds, the
# candidate uploads, and nothing is ever dispatched. `promote.yml` carries the identical warning for the
# identical reason; read it if this needs re-deriving.
#
# ★★ AND THE CONSEQUENCE THAT IS EASY TO MISS EVEN KNOWING THE RULE: EVERY EDIT TO THIS FILE NEEDS A
# PROMOTION BEFORE IT TAKES EFFECT. A fix pushed to `develop` changes nothing about what runs — the
# default branch's copy executes, so the OLD code runs again and fails identically, which reads as "my
# fix did not work" rather than "my fix is not deployed". That cost a full debugging round: a broken
# `steps.` reference was fixed on develop and the very next run reproduced the same stack trace.
# Its sibling `oracle-capture.yml` is a `push` workflow and runs the PUSHED branch's copy, so the two
# iterate at different speeds. When changing this file, expect: push -> CI green -> promote -> then test.
#
# ★ THIS DOES NOT MAKE COMMISSIONING WAIT FOR A PROMOTION. Where this FILE lives and which branch the
# TRIGGERING RUN is on are different things, and conflating them is the easy mistake. The file lands on
# `main` once; from then on a capture running on `develop` dispatches immediately. `main` advances
# automatically whenever develop's CI concludes green (promote.yml), so the one-time cost is seconds,
# not a manual gate, and it is the same one every workflow here already paid.
name: oracle-bridge

on:
  workflow_run:
    workflows: [oracle-capture]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  dispatch:
    # Only a capture that actually succeeded is worth forwarding. A failed capture has no bundle, and an
    # envelope pointing at nothing would open an intake run that can only fail further from the cause.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # ★ A MISSING CREDENTIAL IS NAMED, NOT ARGUED. An unset secret interpolates to an empty string, and
      # the dispatch then fails several steps later with an auth error that points at GitHub rather than at
      # the one thing an operator has to do. The capture-verification-tiers rule this proposal cites is the
      # same one: never fill in a missing premise from reasoning — say which premise is missing.
      # Checked through `env:` rather than a step-level `if:` — `secrets` is not one of the contexts
      # available to a step condition, so the `if` form would silently never fire and this guard would be
      # decoration. `env:` does take secrets, so the check happens where it can actually run.
      # ★ SAY WHICH COPY OF THIS FILE IS RUNNING, BEFORE ANYTHING ELSE.
      # Two things make that genuinely ambiguous here and they compound: a `workflow_run` job executes the
      # DEFAULT BRANCH's copy rather than the branch under development, and a RE-RUN replays the ORIGINAL
      # workflow version rather than the current one. So a fixed bridge can fail with the old error twice
      # over — once because the fix is not promoted, once because the run being retried predates it — and
      # both present as "the fix did not work". `github.sha` on a workflow_run event IS this file's own
      # commit, so printing it answers the question directly instead of leaving it to be inferred.
      - name: Identify this bridge
        run: |
          {
            echo "bridge file commit : ${{ github.sha }}"
            echo "triggering capture : ${{ github.event.workflow_run.head_sha }}"
            echo "triggering run     : ${{ github.event.workflow_run.id }}"
            echo "event              : ${{ github.event_name }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"


      - name: Require the bridge credential
        env:
          ORACLE_BRIDGE_TOKEN: ${{ secrets.ORACLE_BRIDGE_TOKEN }}
        run: |
          if [ -n "$ORACLE_BRIDGE_TOKEN" ]; then exit 0; fi
          echo "oracle-bridge: ORACLE_BRIDGE_TOKEN is not set on this repository." >&2
          echo "  It is the ONLY credential this pipeline needs, and it is deliberately not the automatic" >&2
          echo "  GITHUB_TOKEN, which cannot reach another repository." >&2
          echo "  Create a fine-grained PAT scoped to flighthq/flight-oracles with Contents: read and write," >&2
          echo "  then store it as the ORACLE_BRIDGE_TOKEN Actions secret. See agents/render-oracle-repository.md §7." >&2
          exit 1

      - name: Resolve the candidate artifact
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const artifact = data.artifacts.find((entry) => entry.name.startsWith('oracle-candidate-'));
            if (artifact === undefined) {
              // Not an error worth failing the run over: an oracle-capture run that commissioned nothing
              // uploads nothing, and that is its correct outcome. Saying so beats a red with no cause.
              core.info('no candidate artifact on this run — nothing was commissioned');
              core.setOutput('found', 'false');
              return;
            }
            core.setOutput('found', 'true');
            core.setOutput('id', String(artifact.id));
            // The digest is what binds the envelope to bytes. Intake re-verifies it; forwarding it means a
            // swapped artifact is detectable rather than merely unlikely.
            core.setOutput('digest', artifact.digest ?? '');
            core.setOutput('expires', artifact.expires_at ?? '');

      - name: Dispatch to flight-oracles
        if: steps.artifact.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          # ★ VALUES REACH THE SCRIPT THROUGH `env`, NEVER THROUGH `${{ }}` INSIDE THE SCRIPT BODY.
          # The body is plain Node — there is no `steps` object in it, which is what the first dispatch
          # discovered ("ReferenceError: steps is not defined"). Interpolating would also have run, and is
          # the worse fix: it splices text into a program, which is the script-injection shape.
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.digest }}
          ARTIFACT_EXPIRES: ${{ steps.artifact.outputs.expires }}
        with:
          # A narrowly-scoped App or bot installed on both repositories (§7). Never the automatic
          # GITHUB_TOKEN — it cannot reach another repository.
          github-token: ${{ secrets.ORACLE_BRIDGE_TOKEN }}
          script: |
            const crypto = require('node:crypto');
            const run = context.payload.workflow_run;

            // ★ THE REQUEST BINDING COMES FROM THE REPOSITORY, NOT FROM THE CANDIDATE.
            // §7 requires the envelope to carry the request path and hash. The obvious source is the
            // bundle the capture produced — and that is exactly the source this job must not read, since
            // opening candidate-controlled data in the job holding the cross-repository token is the
            // boundary the two-workflow split exists to enforce.
            // So the queue is read from the landed commit through the API instead. That is strictly
            // better than trusting the bundle: the hash is computed from what is actually committed at
            // `head_sha`, so a candidate cannot name a request it did not come from, and intake can
            // re-derive the same value independently.
            const listing = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'oracle-requests',
              ref: run.head_sha,
            });
            const requests = (Array.isArray(listing.data) ? listing.data : []).filter((e) =>
              e.type === 'file' && e.name.endsWith('.json'),
            );
            if (requests.length === 0) {
              core.setFailed(`no outstanding request at ${run.head_sha}, but a candidate was produced`);
              return;
            }

            // One event per request: §7's envelope names ONE request path and hash, and a reviewer blesses
            // one commission at a time. Sending a list would make the Oracle side invent a policy for
            // partial acceptance that nobody has specified.
            for (const entry of requests) {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: entry.path,
                ref: run.head_sha,
              });
              // sha256 of the file's bytes — deliberately NOT `entry.sha`, which is git's SHA-1 blob id
              // over a `blob <len>\0` header and would not match the value Flight's own
              // `hashOracleFile` computes for the same file.
              const bytes = Buffer.from(file.data.content, file.data.encoding);
              const requestSha256 = crypto.createHash('sha256').update(bytes).digest('hex');

              await github.rest.repos.createDispatchEvent({
                owner: 'flighthq',
                repo: 'flight-oracles',
                // ★ MUST MATCH THE ORACLE INTAKE TRIGGER EXACTLY. GitHub accepts an unmatched
                // repository_dispatch with a 204 and creates no run and no warning — a silent success on
                // both sides. `flight-candidate` was sent for a full round against an intake subscribed to
                // `flight-oracle-candidate`, and nothing anywhere reported a problem.
                event_type: 'flight-oracle-candidate',
                client_payload: {
                  repository: `${context.repo.owner}/${context.repo.repo}`,
                  flightCommit: run.head_sha,
                  requestPath: entry.path,
                  requestSha256,
                  workflowRunId: String(run.id),
                  artifactId: process.env.ARTIFACT_ID,
                  artifactDigest: process.env.ARTIFACT_DIGEST,
                  artifactExpiresAt: process.env.ARTIFACT_EXPIRES,
                },
              });
              core.info(`dispatched ${entry.path} (${requestSha256.slice(0, 12)}…) for ${run.head_sha}`);
            }

      - name: Record what was forwarded
        if: steps.artifact.outputs.found == 'true'
        run: |
          {
            echo "### oracle bridge"
            echo ""
            echo "- flightCommit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- workflowRunId: \`${{ github.event.workflow_run.id }}\`"
            echo "- artifactId: \`${{ steps.artifact.outputs.id }}\`"
            echo "- artifactDigest: \`${{ steps.artifact.outputs.digest }}\`"
            echo "- expires: \`${{ steps.artifact.outputs.expires }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
