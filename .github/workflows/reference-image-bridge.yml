# Forwards a completed capture to `flight-reference-images` as one fixed batch dispatch envelope.
# agents/render-reference-image-repository.md §7 step 3.
#
# ★★ THIS IS THE PRIVILEGED HALF, AND IT NEVER EXECUTES THE COMMISSIONED CHECKOUT.
# It holds the credential that can open a pull request in another repository, so §7 requires it to be a
# separately triggered workflow that "does not execute the Flight checkout or extract candidate-controlled
# archives; it forwards only the fixed dispatch envelope and recorded digest."
#
# `workflow_run` is what enforces that. A `workflow_run` job runs the workflow file from the DEFAULT
# BRANCH, with a fresh context — not the commissioned commit's copy of it. So a request that lands
# malicious code changes what `reference-image-capture` runs, and changes nothing about this file, this token, or
# this envelope. There is deliberately NO checkout step here, and deliberately no artifact download: this
# workflow never reads a byte the capture produced. It reads the run's metadata through the API and sends
# identifiers onward. Intake downloads and verifies the bytes itself, with its own separation of
# unprivileged extraction from privileged writing.
#
# ★ IF YOU ARE TEMPTED TO ADD `actions/download-artifact` HERE, THAT IS THE BOUNDARY BEING CROSSED.
# Extracting a candidate-controlled archive in the job that holds the cross-repository token is exactly
# the thing the split exists to prevent — an archive is attacker-controlled input, and this job's token
# can rewrite the store the candidate is being measured against.
# ★★ THIS FILE MUST LIVE ON THE REPOSITORY'S DEFAULT BRANCH (`main`) OR IT DOES NOT RUN AT ALL.
# GitHub registers `workflow_run` workflows only from the default branch: a copy on `develop` alone is
# invisible to Actions, never appears in the run list, and reports no error — the capture succeeds, the
# candidate uploads, and nothing is ever dispatched. `promote.yml` carries the identical warning for the
# identical reason; read it if this needs re-deriving.
#
# ★★ AND THE CONSEQUENCE THAT IS EASY TO MISS EVEN KNOWING THE RULE: EVERY EDIT TO THIS FILE NEEDS A
# PROMOTION BEFORE IT TAKES EFFECT. A fix pushed to `develop` changes nothing about what runs — the
# default branch's copy executes, so the OLD code runs again and fails identically, which reads as "my
# fix did not work" rather than "my fix is not deployed". That cost a full debugging round: a broken
# `steps.` reference was fixed on develop and the very next run reproduced the same stack trace.
# Its sibling `reference-image-capture.yml` is a `push` workflow and runs the PUSHED branch's copy, so the two
# iterate at different speeds. When changing this file, expect: push -> CI green -> promote -> then test.
#
# ★ THIS DOES NOT MAKE COMMISSIONING WAIT FOR A PROMOTION. Where this FILE lives and which branch the
# TRIGGERING RUN is on are different things, and conflating them is the easy mistake. The file lands on
# `main` once; from then on a capture running on `develop` dispatches immediately. `main` advances
# automatically whenever develop's CI concludes green (promote.yml), so the one-time cost is seconds,
# not a manual gate, and it is the same one every workflow here already paid.
name: Reference Images · Bridge

on:
  workflow_run:
    workflows: ['Reference Images · Capture']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  dispatch:
    name: Reference Images · Bridge
    # Only a capture that actually succeeded is worth forwarding. A failed capture has no bundle, and an
    # envelope pointing at nothing would open an intake run that can only fail further from the cause.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # ★ A MISSING CREDENTIAL IS NAMED, NOT ARGUED. An unset secret interpolates to an empty string, and
      # the dispatch then fails several steps later with an auth error that points at GitHub rather than at
      # the one thing an operator has to do. The capture-verification-tiers rule this proposal cites is the
      # same one: never fill in a missing premise from reasoning — say which premise is missing.
      # Checked through `env:` rather than a step-level `if:` — `secrets` is not one of the contexts
      # available to a step condition, so the `if` form would silently never fire and this guard would be
      # decoration. `env:` does take secrets, so the check happens where it can actually run.
      # ★ SAY WHICH COPY OF THIS FILE IS RUNNING, BEFORE ANYTHING ELSE.
      # Two things make that genuinely ambiguous here and they compound: a `workflow_run` job executes the
      # DEFAULT BRANCH's copy rather than the branch under development, and a RE-RUN replays the ORIGINAL
      # workflow version rather than the current one. So a fixed bridge can fail with the old error twice
      # over — once because the fix is not promoted, once because the run being retried predates it — and
      # both present as "the fix did not work". `github.sha` on a workflow_run event IS this file's own
      # commit, so printing it answers the question directly instead of leaving it to be inferred.
      - name: Identify this bridge
        run: |
          {
            echo "bridge file commit : ${{ github.sha }}"
            echo "triggering capture : ${{ github.event.workflow_run.head_sha }}"
            echo "triggering run     : ${{ github.event.workflow_run.id }}"
            echo "event              : ${{ github.event_name }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ★ A MISSING CREDENTIAL IS NAMED, NOT ARGUED. An unset secret interpolates to an empty string and
      # the failure then surfaces as a token-minting or auth error that points at GitHub rather than at the
      # one thing an operator has to do. Checked through `env:` rather than a step-level `if:` — `secrets`
      # is not a context available to a step condition, so the `if` form would silently never fire.
      - name: Require the bridge credential
        env:
          APP_ID: ${{ secrets.ORACLE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
        run: |
          missing=''
          [ -z "$APP_ID" ] && missing="$missing ORACLE_APP_ID"
          [ -z "$APP_PRIVATE_KEY" ] && missing="$missing ORACLE_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "reference-image-bridge: missing secret(s):$missing" >&2
            echo "  This pipeline authenticates as a GitHub App installed on flighthq/flight-reference-images." >&2
            echo "  It is deliberately not the automatic GITHUB_TOKEN, which cannot reach another repository." >&2
            echo "  Store the App's numeric id and its full .pem private key as those two Actions secrets." >&2
            echo "  See agents/render-reference-image-repository.md §7." >&2
            exit 1
          fi

      # ★ A SHORT-LIVED INSTALLATION TOKEN, SCOPED TO ONE REPOSITORY. This is what §7 asks for over a
      # personal token: it expires in an hour, it carries no human's identity, it is revocable on its own,
      # and `repositories:` narrows it to the single repo the envelope is sent to. The App's private key
      # never leaves this job, and the capture workflow — which executes commissioned code — has neither.
      - name: Mint an installation token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ORACLE_APP_ID }}
          private-key: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
          owner: flighthq
          repositories: flight-reference-images

      # ★ ONE ARTIFACT PER REQUEST, SO EACH BATCH MEMBER'S PAIRING IS THE ARTIFACT'S NAME. Each candidate
      # archive holds exactly one `candidate.json` at its root. Deriving the request from the artifact name
      # keeps that pairing in one place; deriving it separately would let a batch member bind request A's
      # path to request B's bytes, and every hash downstream would still verify.
      - name: Dispatch candidate batch
        id: dispatch
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const crypto = require('node:crypto');
            const run = context.payload.workflow_run;

            // Artifact metadata only — this job never downloads or extracts a candidate archive, because
            // it holds the credential that can write to the ReferenceImage repository (§7).
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            const candidates = data.artifacts.filter((a) => a.name.startsWith('reference-image-candidate-'));
            if (candidates.length === 0) {
              core.info('no candidate artifact on this run — nothing was commissioned');
              return;
            }

            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (repository !== 'flighthq/flight') {
              core.setFailed(`batch schema accepts only flighthq/flight, not ${repository}`);
              return;
            }

            const batchCandidates = [];
            const legacyCandidates = [];
            const requestPaths = new Set();
            const artifactIds = new Set();
            const unnamed = [];
            for (const artifact of candidates) {
              // The capture workflow prefixes a display-only entry label, but the trailing UUID remains
              // the identity. Accept the legacy UUID-only name too so promoting this bridge cannot break
              // a capture that started on the previous workflow revision.
              const requestId = artifact.name.match(
                /^reference-image-candidate-(?:.+-)?(?<requestId>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i,
              )?.groups?.requestId;
              // COLLECT AND CONTINUE, never `setFailed` + `return`. The label in this name is display
              // metadata, and one artifact whose name it cannot read says nothing about its siblings —
              // aborting here would drop candidates that are perfectly well formed, turning a cosmetic
              // naming problem into lost capture work. The run is still failed, but AFTER every good
              // candidate has been dispatched, so the report costs nobody else their result.
              if (requestId === undefined) {
                core.warning(`candidate artifact ${artifact.name} does not end in a request UUID; skipping it`);
                unnamed.push(artifact.name);
                continue;
              }
              const requestPath = `reference-image-requests/${requestId}.json`;
              if (requestPaths.has(requestPath)) {
                core.setFailed(`candidate artifacts repeat request path ${requestPath}`);
                return;
              }
              if (artifactIds.has(artifact.id)) {
                core.setFailed(`candidate artifacts repeat artifact id ${artifact.id}`);
                return;
              }
              if (!/^sha256:[0-9a-f]{64}$/.test(artifact.digest ?? '')) {
                core.setFailed(`artifact ${artifact.id} has no schema-valid sha256 digest`);
                return;
              }

              // The request binding is read from the REPOSITORY at the landed commit, never from the
              // candidate: the hash then describes what is actually committed, so a candidate cannot
              // claim a request it did not come from, and intake can re-derive the same value.
              let file;
              try {
                file = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: requestPath,
                  ref: run.head_sha,
                });
              } catch {
                core.setFailed(`artifact ${artifact.name} names ${requestPath}, absent at ${run.head_sha}`);
                return;
              }
              const bytes = Buffer.from(file.data.content, file.data.encoding);
              const requestSha256 = crypto.createHash('sha256').update(bytes).digest('hex');
              requestPaths.add(requestPath);
              artifactIds.add(artifact.id);
              batchCandidates.push({
                requestPath,
                requestSha256,
                artifactId: artifact.id,
                artifactDigest: artifact.digest,
              });
              legacyCandidates.push({ artifact, requestPath, requestSha256 });
            }

            // ★ TEMPORARY CUTOVER SEAM. Exactly one branch runs. Keep the already-exercised v1 sender
            // available for a manual rollback until a real v2 repository_dispatch starts intake-batch.yml;
            // delete the false branch in a separate commit only after that downstream run is observed.
            const useBatchDispatch = true;
            batchCandidates.sort((left, right) => left.requestPath.localeCompare(right.requestPath));
            if (useBatchDispatch) {
              if (batchCandidates.length > 256) {
                core.setFailed(`batch has ${batchCandidates.length} candidates; schema maximum is 256`);
                return;
              }
              if (batchCandidates.length > 0) {
                await github.rest.repos.createDispatchEvent({
                  owner: 'flighthq',
                  repo: 'flight-reference-images',
                  // ★ MUST MATCH THE ORACLE BATCH INTAKE TRIGGER EXACTLY. GitHub accepts an unmatched
                  // repository_dispatch with a 204 and creates no run and no warning — a silent success on
                  // both sides, which cost a full round when this said `flight-candidate`.
                  event_type: 'flight-reference-image-candidate-batch',
                  client_payload: {
                    schemaVersion: 2,
                    repository,
                    flightCommit: run.head_sha,
                    workflowRunId: run.id,
                    candidates: batchCandidates,
                  },
                });
                core.info(`dispatched one batch containing ${batchCandidates.length} candidate(s)`);
              }
              core.setOutput('dispatches', batchCandidates.length > 0 ? '1' : '0');
            } else {
              for (const { artifact, requestPath, requestSha256 } of legacyCandidates) {
                await github.rest.repos.createDispatchEvent({
                  owner: 'flighthq',
                  repo: 'flight-reference-images',
                  event_type: 'flight-reference-image-candidate',
                  client_payload: {
                    repository,
                    flightCommit: run.head_sha,
                    requestPath,
                    requestSha256,
                    workflowRunId: String(run.id),
                    artifactId: String(artifact.id),
                    artifactDigest: artifact.digest ?? '',
                    artifactExpiresAt: artifact.expires_at ?? '',
                  },
                });
                core.info(`dispatched ${requestPath} with artifact ${artifact.id} (${artifact.name})`);
              }
              core.setOutput('dispatches', String(legacyCandidates.length));
            }
            core.setOutput('sent', String(batchCandidates.length));
            if (unnamed.length > 0) {
              core.setFailed(`candidate artifact(s) with no request UUID were skipped: ${unnamed.join(', ')}`);
            }

      - name: Record what was forwarded
        run: |
          {
            echo "### oracle bridge"
            echo ""
            echo "- bridge file commit: \`${{ github.sha }}\`"
            echo "- flightCommit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- dispatches sent: \`${{ steps.dispatch.outputs.dispatches || 0 }}\`"
            echo "- candidates forwarded: \`${{ steps.dispatch.outputs.sent || 0 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
