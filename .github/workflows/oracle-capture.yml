# Captures the cells one outstanding oracle request names and uploads the candidate bundle.
# agents/render-oracle-repository.md §7 step 2.
#
# ★★ THIS WORKFLOW IS UNTRUSTED-CODE EXECUTION AND HOLDS NO CROSS-REPOSITORY CREDENTIAL.
# It checks out a commissioned Flight commit and runs its build, its browsers and its capture tool —
# whoever can land a request can run arbitrary code in this job. `permissions` is therefore read-only on
# contents and nothing else, and there is no secret in this file. The dispatch to `flight-oracles` lives
# in `oracle-bridge.yml`, which never executes this checkout. §7's credential boundary exists so that a
# commissioned source commit cannot read the credential able to rewrite the store it is measured against;
# splitting it across two workflows is what enforces it, not a convention anyone has to remember.
#
# ★ THE TRIGGER IS EVERY PUSH TO THE TRUNK, DELIBERATELY, AND THAT REPLACED A PATH FILTER THAT KEPT
# SILENTLY MISSING COMMISSIONS. A path filter answers "did the queue change in this push"; the body
# answers "what is outstanding now". Those are different questions, and three separate pushes ran no
# capture because a fix landed under `scripts/` or under the sibling workflow file rather than under
# `oracle-requests/`. Each miss looked like success: no run, no error, nothing in the run list.
# The body is the queue's only reader, so the trigger now simply asks it on every push. That is only
# affordable because the build is gated on there being work (below) — an empty queue is a checkout and
# an `npm ci`.
#
# ★ NOT `pull_request_target`, AND NOT A FORK TRIGGER. Both would hand a commissioned commit a token with
# write scope on this repository. The trigger is a push to the trunk — work that has already landed — plus
# a manual dispatch for re-running one request. That is the same boundary §7 names: "the user's normal
# merge/push is the boundary at which remote automation can act."
name: oracle-capture

# ★ THE TRIGGER AND THE BODY MUST AGREE ABOUT WHAT THE QUEUE IS. The body processes every OUTSTANDING
# request (§5), so a request can be outstanding while nothing re-triggers a run for it — which is exactly
# what happened once the queue-enumeration fix landed: the request was still pending, the workflow was
# fixed, and no push touched `oracle-requests/**` again, so nothing ran. The workflow files are therefore
# part of the trigger too: a fix to this pipeline tests itself against the live queue. That is cheap by
# construction — with an empty queue the job installs dependencies, finds nothing outstanding, and exits.
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      request:
        # Optional: omit it to process the whole outstanding queue, which is the manual equivalent of what
        # a push does. Requiring a path made "re-run the queue" impossible without inventing a commit.
        description: 'One oracle-requests/<id>.json, or leave blank for every outstanding request'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One capture per request at a time. Two concurrent runs of the same request would upload two bundles
  # with the same request hash and different artifact digests, and intake could not tell which was current.
  group: oracle-capture-${{ github.event.inputs.request || github.sha }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commissioned commit. `github.sha` on a push to the trunk IS the landed commit, which
          # is the value §5 says binds a request — the request itself deliberately does not name it.
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # ★ THE QUEUE IS THE DIRECTORY, NOT THE DIFF. §5: "The directory is a queue of outstanding work, not
      # an archive of every completed request. The lock-bump PR removes a fulfilled request." So every file
      # present IS outstanding, and asking git what this push changed answers a question the design does not
      # pose.
      #
      # The first run proved why that matters: diffing against the push event's `before` SHA died with
      # `fatal: bad object`, because actions/checkout is a shallow clone and that commit is not in it.
      # `fetch-depth: 0` would have fixed that one symptom and left the others — a force-push, a first push
      # to a new branch, and a squash merge all produce a `before` that is absent, all-zeroes, or unrelated.
      # Enumerating the queue has none of those cases, and it self-heals: a request whose capture failed is
      # still in the directory, so the next push retries it instead of needing the failure re-committed.
      - id: requests
        run: |
          if [ -n "${{ github.event.inputs.request }}" ]; then
            list="${{ github.event.inputs.request }}"
          else
            list=$(ls oracle-requests/*.json 2>/dev/null | tr '\n' ' ')
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "outstanding requests: ${list:-<none>}"

      # ★ THE BUILD IS PAID ONLY WHEN THERE IS WORK, AND THAT IS WHAT LETS THE TRIGGER BE BROAD.
      # The capture needs a built tree — the first successful-looking run produced a bundle with zero
      # images because this step was missing, so the harness had nothing to render. But building before
      # knowing whether anything is outstanding made every triggered run expensive, which is why the
      # trigger was path-filtered, which is why three separate pushes silently commissioned nothing.
      # Deciding first inverts that: an empty queue costs a checkout and an `npm ci`, so the trigger can
      # be every push to the trunk and the body's "process what is outstanding" finally matches it.
      - name: Build the harness
        if: success() && steps.requests.outputs.list != ''
        run: |
          npm run build
          npm run build:functional

      - name: Install Playwright browsers
        if: success() && steps.requests.outputs.list != ''
        run: npx playwright install --with-deps chromium

      # ★ THE ENVIRONMENT IS RECORDED, NOT PINNED. §10 has not been ruled: whether reference sets are keyed
      # per backend or per backend × environment is open, so this workflow does not presume a canonical
      # environment exists. It records WHAT PRODUCED the image — runner image, browser build — as an
      # opaque id travelling with the bundle. When §10 lands, this becomes either a pinned digest or a key;
      # until then, recording it costs nothing and claiming it would be the schema decision being deferred.
      - id: environment
        if: success() && steps.requests.outputs.list != ''
        run: |
          browser=$(npx playwright --version | tr -d ' ')
          descriptor="runner=${ImageOS:-unknown};image=${ImageVersion:-unknown};${browser};viewport=default"
          echo "id=$(printf '%s' "$descriptor" | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
          echo "descriptor=$descriptor" >> "$GITHUB_OUTPUT"

      - name: Capture the commissioned cells
        if: success() && steps.requests.outputs.list != ''
        env:
          ORACLE_FLIGHT_COMMIT: ${{ github.sha }}
          ORACLE_ENVIRONMENT_ID: ${{ steps.environment.outputs.id }}
        run: |
          set -euo pipefail
          for request in ${{ steps.requests.outputs.list }}; do
            echo "::group::$request"
            # The scope comes from the request through one code path (getOracleRequestCells), so the
            # workflow never re-derives which cells are in scope. A second derivation here would be a
            # second definition of "in scope" for the pending allowance to disagree with.
            npx tsx ./scripts/oracle-commission.ts scope "$request" | while read -r args; do
              npx tsx ./packages/tool-capture/src/bin.ts capture $args
            done
            npx tsx ./scripts/oracle-commission.ts bundle "$request" \
              --artifacts .artifacts \
              --stage candidate
            echo "::endgroup::"
          done

      # The candidate PNGs and the bundle travel together: intake verifies the bundle's per-image
      # artifactSha256 against these exact bytes before it stages anything.
      - uses: actions/upload-artifact@v4
        if: success() && steps.requests.outputs.list != ''
        with:
          name: oracle-candidate-${{ github.sha }}
          # ★ ONE SELF-CONTAINED CANDIDATE TREE, AND `image.file` IS ITS ONLY MAP.
          # Previously this uploaded Flight's raw capture tree, so the archive held
          # `.artifacts/<subject>/<entry>/<renderer>/screenshot.png` while every bundle record said
          # `<identity>.png` — intake would have read that as every image missing. It also needed
          # `include-hidden-files` purely because `.artifacts` begins with a dot. Staging removes both:
          # the archive shape is now a contract rather than a reflection of Flight's internals.
          path: candidate
          if-no-files-found: error
          retention-days: 30

      # A count, checked, because a glob that silently matches nothing is what produced the 622-byte
      # artifact. This fails the run rather than letting a hash-only bundle reach intake.
      - name: Assert the candidate carries its images
        if: success() && steps.requests.outputs.list != ''
        run: |
          pngs=$(find candidate/images -name '*.png' 2>/dev/null | wc -l)
          echo "staged images: $pngs"
          find candidate -type f | sed 's/^/  /'
          if [ "$pngs" -eq 0 ]; then
            echo "oracle-capture: the bundle reported captures but no image was staged to upload" >&2
            exit 1
          fi

      - if: success() && steps.requests.outputs.list != ''
        run: |
          {
            echo "### oracle candidate"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- environment: \`${{ steps.environment.outputs.descriptor }}\`"
            echo "- environmentId: \`${{ steps.environment.outputs.id }}\`"
            echo ""
            for bundle in candidate/*.bundle.json; do
              echo "\`$bundle\`:"
              echo '```json'
              cat "$bundle"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
