name: Nightly

# Per-push CI (tests.yml) gates the build, typecheck, merged unit tests, host tests, Rust tests, and
# render smoke — so nightly does NOT repeat them. Nightly holds the work too slow or too
# environment-sensitive for every push: the per-package-environment test shards, render parity, the
# reference-image comparison, full coverage thresholds, API-surface generation, the minified bundle
# size, and the crates.io snapshot publish (of main, not develop; see `rust-snapshot`).
#
# Size is split across the two paths on cost. Per-PR runs `npm run size`, a fast unminified esbuild
# sweep that reports advisory tree-shaking deltas. The terser-minified sweep — the number that is
# actually shipped — takes about a minute across the dedicated fixture corpus and runs here.
#
# Nightly does NOT own promotion to main — promote.yml does, triggered per-commit by CI going
# green. Promotion used to live here so it could inherit the coverage + api gates, but that
# coupling stalled main for reasons unrelated to whether the code works, and pinning develop's
# tip once a day meant a red tip discarded that day's green commits entirely. The jobs below are
# health signals on develop; they gate nothing.
#
# The `resolve` job still pins develop's tip once so every quality job tests exactly the same
# commit — scheduled workflows otherwise check out the default branch, which is not what nightly
# is meant to test.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# Electron's postinstall downloads a ~100MB prebuilt binary from GitHub releases on the critical path of
# every `npm ci`. NOTHING IN CI LAUNCHES ELECTRON: the only scripts that do are electron:review*,
# dev:examples:electron and the *-harness pair, none of which any job here runs. The build matrix targets
# tools/functional and @flighthq/examples (the WEB runner) — both plain `vite build` — and every capture
# leg drives Playwright chromium, not Electron.
#
# Skipping the download still installs the package and its TYPES, which the build does need:
# tsconfig.build.json includes packages/host-electron, so typechecking resolves electron's declarations.
# Only actually launching Electron needs the platform binary, and no job here does.
#
# Set here rather than in .npmrc on purpose: a repo-wide setting would leave a developer's
# `npm run electron:review` without a binary to launch.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  resolve:
    name: Pin develop
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
      - id: pin
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The crates.io snapshot lane: main's tip under the same `edge` version npm published for that
  # commit, so one version string names one commit on both registries. crates.io has no dist-tags to
  # subscribe to, so it carries a single snapshot lane — the promoted one — rather than mirroring npm's
  # per-push develop (`next`) lane; to depend on an unreleased develop commit from Cargo, use a git
  # dependency pinned by `rev`. Stable releases publish from release.yml.
  #
  # crates.io admits roughly one new version a minute once a short burst is spent, so the ~155-crate
  # graph takes about two hours — the reason this is nightly rather than per promotion. Per-push CI runs
  # `cargo publish --workspace --dry-run`, so a crate that cannot publish is already red on the push
  # that broke it; a failure here is a registry or network problem.
  #
  # Refuses a main commit with no successful CI run (a hand push skips Promote's guarantee). Skipped
  # when crates.io already has flight-sdk at this version. flight-sdk publishes last, so its
  # presence means the whole graph landed; a run that failed partway leaves it absent, and the next
  # night retries (crates already uploaded are skipped as "already exists").
  rust-snapshot:
    name: Rust · resolve edge snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read tests.yml conclusions for main's commit
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(npx tsx scripts/edge-version.ts main | sed -n 's/^version=//p')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Promote only moves main to a commit whose CI passed, but a hand push to main skips that.
          # Re-prove it for this exact commit, as Edge publish and Release do; no run is never green.
          successes=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?head_sha=${sha}" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "${successes:-0}" -eq 0 ]; then
            echo "::error::main is at ${sha}, which has no successful CI (tests.yml) run; refusing to publish it to crates.io."
            exit 1
          fi
          # crates.io asks API clients to identify themselves.
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'flighthq-nightly (github.com/flighthq/flight)' \
            "https://crates.io/api/v1/crates/flight-sdk/$version")
          if [ "$status" = 200 ]; then
            echo "flight-sdk $version is already on crates.io; nothing to publish"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          elif [ "$status" = 404 ]; then
            echo "flight-sdk $version is not on crates.io yet; publishing"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo "::error::crates.io answered HTTP $status for flight-sdk $version"
            exit 1
          fi

  rust-publish:
    name: Publish · crates.io edge
    needs: rust-snapshot
    if: ${{ needs.rust-snapshot.outputs.publish == 'true' }}
    uses: ./.github/workflows/rust-publish.yml
    with:
      ref: ${{ needs.rust-snapshot.outputs.sha }}
      version: ${{ needs.rust-snapshot.outputs.version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # The thorough unit lane, moved here from per-push CI (which keeps the merged `test-fast` run). Each package runs
  # under its own vitest config, so node packages use the `node` environment and jsdom packages use
  # `jsdom`, each isolated in its own process — correct, but that is 141 serial Vitest startups plus a
  # fresh environment per test file. Fitting a full run gave `node ≈ 4.9s + 0.22s/file` and
  # `jsdom ≈ 2.1s + 0.90s/file` per package: startup dominates the small node packages, per-file DOM
  # construction dominates everything else, and neither is removable without giving up the fidelity
  # this lane exists for. So it is DIVIDED rather than optimised — sharded by package across runners,
  # weight-balanced in scripts/test-shard.ts, with `--shard` scaling off `strategy.job-total` so the
  # matrix length is the only place the shard count is written.
  #
  # The division is NOT free and does not reach 4x: measured, the whole lane is 29m13s serial while one
  # quarter of it is 11m35s, or 40% rather than 25%. The gap is cold cache. Running 141 packages in one
  # process warms the module and page cache for the ones behind it; four runners each start cold over
  # 35, so that warm-up is paid four times. Wall clock still improves ~2.5x, but this lane's runner
  # minutes go UP by roughly 60%. The sharding predates this lane's move to nightly, where wall clock no
  # longer gates a push; it is kept because one serial 29-minute job would still delay the morning signal.
  #
  # Folding the 141 configs into one Vitest run via `projects` was measured and rejected: each project
  # gets its own Vite server and therefore its own transform cache, so the boots merely move inside one
  # process and stay serial — and being serial per project, they are paid in full by every shard, which
  # is what makes that shape unshardable. See the header of scripts/test-packages.ts.
  #
  # This is the one lane that runs tool-capture's serialized browser contracts; `test-fast` excludes
  # tool-capture so pushes stay fast and don't launch browsers.
  test:
    name: TypeScript · per-package tests · ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard runs even when one fails: they test disjoint packages, so a failure in one says
      # nothing about the others and cancelling them costs a whole extra CI round to learn the rest.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # Only the shard holding tool-capture needs a browser, but which shard that is depends on the
      # split, so every shard installs. Chromium is cached by the runner image and this is well off
      # the critical path of the shard that actually uses it.
      - uses: ./.github/actions/setup-playwright
      - run: npm run test:unit -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  coverage:
    name: TypeScript · coverage
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: ./.github/actions/setup-playwright
      - run: npm run test:coverage

  # The shipping bundle size: every dedicated tools/size fixture built through terser, failing when
  # one exceeds its pin in tools/size/size.baseline.json. Examples are demonstrations and may import
  # whole-store conveniences, so they are deliberately not the cost contract. It runs here rather
  # than per-PR because the terser leg is not worth adding to every push for a number that moves rarely.
  #
  # Like every job here it is a health signal and blocks no promotion — so moving it off the PR path
  # means shipping size is no longer enforced before a commit reaches main. That is deliberate: the
  # pin's own remedy (`size:minified:baseline`) erases whatever the gate objected to, so a red gate
  # mostly bought a rewritten pin. Catching it nightly and deciding costs a day and keeps the record.
  size-minified:
    name: TypeScript · bundle size (minified)
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run size:minified

  api:
    name: TypeScript · API generation
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run api
      - run: npm run api:json

  # Cross-backend parity (Tier 3), moved here from per-push CI, which keeps the smoke legs. Parity must
  # compare backends within one run, so each leg keeps every renderer together and serializes with
  # `--parallel 1` (the runner has one SwiftShader adapter; see the render-test notes in tests.yml).
  # The parity check imports the SDK from built dist, so each leg builds the graph first.
  render-parity:
    name: Render · ${{ matrix.label }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: functional · parity
            check: test:functional:parity
          - label: examples · parity
            check: test:examples:parity
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: ./.github/actions/setup-playwright
      - run: npm run ${{ matrix.check }} -- --parallel 1 --retries 2
        env:
          FLIGHT_CAPTURE_WORKER_COUNT: 2
          FLIGHT_CAPTURE_TIMEOUT_MS: 45000

  # The blessed-image comparison: the only tier that can detect a pixel regression against promoted
  # reference bytes. It moved here from per-push CI, so Promote no longer waits on it — a pixel
  # regression now surfaces the next morning instead of blocking main. Render smoke still runs per push.
  #
  # Reference packs are public HTTPS reads, the job holds no secret, and its token is explicitly
  # read-only. A zero-comparison run is a failure rather than a green no-op; the lock bounds the capture
  # scope to cells for which reference bytes actually exist.
  reference-image-check:
    name: Render · reference images
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The pack manifest does not yet carry capture provenance, so this must match the frame that was
      # blessed. State it once for scope resolution and comparison rather than allowing either to guess.
      ORACLE_CAPTURE_FRAMES: 1

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # Fetch first: an unresolvable lock fails before the expensive build, and the fetched packs define
      # the exact capture scope used below.
      - name: Fetch and verify the pinned reference packs
        run: npx tsx ./scripts/reference-image-check.ts fetch

      - name: Resolve the capture scope
        id: reference_scope
        run: |
          set -euo pipefail
          scope=$(npx tsx ./scripts/reference-image-check.ts scope --frames "$ORACLE_CAPTURE_FRAMES")
          echo "$scope"
          {
            echo 'lines<<SCOPE'
            echo "$scope"
            echo 'SCOPE'
          } >> "$GITHUB_OUTPUT"

      - name: Build the harness
        run: |
          npm run build
          npm run build:functional

      - uses: ./.github/actions/setup-playwright

      # Echo the registered identity instead of recomputing it. The reference-image repository owns the
      # identity; the observed browser is diagnostic evidence if the hosted runner later drifts from it.
      - name: Echo the registered capture environment
        run: |
          echo "registered identity: $(node -p "require('./scripts/reference-image-capture-identity.json').environmentId")"
          echo "observed playwright: $(npx playwright --version | tr -d ' ')"

      - name: Capture the pinned cells
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.reference_scope.outputs.lines }}" | while read -r args; do
            [ -n "$args" ] || continue
            npx tsx ./packages/tool-capture/src/bin.ts capture $args
          done

      - name: Compare against the blessed references
        run: npx tsx ./scripts/reference-image-check.ts check --frames "$ORACLE_CAPTURE_FRAMES"

      # Green captures are disposable; on failure these bytes are the diagnosis.
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reference-image-check-captures
          path: |
            .artifacts/functional/**/screenshot.png
            .artifacts/reference-image-packs/**/*.png
          include-hidden-files: true
          if-no-files-found: warn

  # Routes the red. A scheduled run has no author watching it, so without this its failures land
  # nowhere — which is not hypothetical: `coverage` and `api` ran unrouted for their whole existence,
  # and a signal nobody receives is indistinguishable from a signal that never fired.
  #
  # ★ IT DEDUPLICATES, and that is the difference between a route and a nuisance. A job that opens a
  # fresh issue every night turns one persistent failure into thirty issues a month, and the reader
  # mutes the label — the same death as never routing at all. Each failing job maps to a STABLE
  # TITLE, and an already-open issue with that title gets a comment instead of a duplicate. So a
  # standing failure is one issue that accumulates run links, and its comment count is how long it
  # has been broken.
  #
  # It deliberately does NOT auto-close on a later green: closing an issue somebody may be
  # investigating is a worse failure than leaving it open, and a fixed failure stops accumulating
  # comments, which is the readable signal anyway.
  #
  # `if: failure()` fires when a needed job failed; the per-job `result` check below is what keeps a
  # green job from being named in the report.
  report-failure:
    name: Route failures
    needs: [resolve, coverage, api, test, render-parity, reference-image-check, rust-snapshot, rust-publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      # The only privilege this workflow needs beyond read. No secret and no external service: the
      # automatic GITHUB_TOKEN carries it, which is why this route works in a fork-free scheduled run.
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v5
      - name: Open or update one issue per failing job
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          API_RESULT: ${{ needs.api.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RENDER_PARITY_RESULT: ${{ needs.render-parity.result }}
          REFERENCE_IMAGE_RESULT: ${{ needs.reference-image-check.result }}
          RUST_SNAPSHOT_RESULT: ${{ needs.rust-snapshot.result }}
          RUST_PUBLISH_RESULT: ${{ needs.rust-publish.result }}
        run: |
          set -euo pipefail
          route() {
            job="$1"; result="$2"
            # Only a real failure routes. `skipped` and `cancelled` are not defects, and routing them
            # is how a route trains its reader to ignore it.
            [ "$result" = "failure" ] || return 0
            title="Nightly failure: $job"
            # Dedup key is the exact title. `--search` is a fuzzy match, so the jq filter re-checks
            # equality — otherwise "Nightly failure: api" would match "Nightly failure: api-extras"
            # and a second job's red would be filed as a comment on the first job's issue.
            existing=$(gh issue list --state open --search "\"$title\" in:title" \
              --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Still failing — $RUN_URL"
              echo "$job: commented on #$existing"
            else
              gh issue create --title "$title" --body \
          "The nightly \`$job\` job failed.

          First observed: $RUN_URL

          This issue is reused for every later failure of the same job, so the comment count is how long it has been red. It is not closed automatically — a green run simply stops adding comments."
              echo "$job: opened a new issue"
            fi
          }
          route "resolve" "$RESOLVE_RESULT"
          route "coverage" "$COVERAGE_RESULT"
          route "api" "$API_RESULT"
          route "test" "$TEST_RESULT"
          route "render-parity" "$RENDER_PARITY_RESULT"
          route "reference-image-check" "$REFERENCE_IMAGE_RESULT"
          route "rust-snapshot" "$RUST_SNAPSHOT_RESULT"
          route "rust-publish" "$RUST_PUBLISH_RESULT"
