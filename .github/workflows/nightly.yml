name: Nightly

# The nightly stage of the lifecycle — a blessing, not a test run:
#
#   develop → CI → `next` (npm next) → Validate → Nightly → `main` (edge: crates.io + npm) → tag (latest)
#
# Every commit on `next` already passed CI; Validate then ran the slower checks on it. Nightly takes the
# newest commit on `next` that passed Validate, fast-forwards `main` to it, and publishes it as `edge` on
# both registries in the same run — crates.io first, then npm, under one version — so `main`, npm
# `edge` and crates.io `edge` always name the same commit. Nothing promoted here is tested for the
# first time tonight, so there are no morning surprises.
#
# The publish also catches up: crates.io is probed for main's version (flight-sdk uploads last, so its
# presence means the graph landed), and npm is re-run after any failed Nightly, so a failed or partial
# publish is completed the next night even when nothing new was promoted.
#
# Health signals run alongside and gate nothing: coverage, minified size, API generation, Conformance
# (the fixture corpus, too large to gate on), and the Host backends on real platforms (advisory).
# Conformance and Host Backends live in their own files, called here, so each stays runnable by hand.
#
# ★ QUIET NIGHTS ARE CHEAP. Resolve and the one-minute edge check always run (the check is what
# completes a failed or partial publish). Promotion runs only with a validated commit to promote, the
# publishes only when a registry lacks main's version, and the health signals only after a push to
# develop since the last SUCCESSFUL Nightly — so a failed one reruns rather than going quiet. A manual
# run promotes and publishes whatever is ready and runs every health signal: the "promote now" button.
#
# Size is split across the two paths on cost. Hygiene runs `npm run size`, a fast unminified esbuild
# sweep that reports advisory tree-shaking deltas. The terser-minified sweep — the number that is
# actually shipped — takes about a minute across the dedicated fixture corpus and runs here.
on:
  schedule:
    # Off the top of the hour, where GitHub delays or drops scheduled runs under load.
    - cron: '23 4 * * *'
  workflow_dispatch:

# Electron's postinstall downloads a ~100MB prebuilt binary from GitHub releases on the critical path of
# every `npm ci`. NOTHING IN CI LAUNCHES ELECTRON: the only scripts that do are electron:review*,
# dev:examples:electron and the *-harness pair, none of which any job here runs. The build matrix targets
# tools/functional and @flighthq/examples (the WEB runner) — both plain `vite build` — and every capture
# leg drives Playwright chromium, not Electron.
#
# Skipping the download still installs the package and its TYPES, which the build does need:
# tsconfig.build.json includes packages/host-electron, so typechecking resolves electron's declarations.
# Only actually launching Electron needs the platform binary, and no job here does.
#
# Set here rather than in .npmrc on purpose: a repo-wide setting would leave a developer's
# `npm run electron:review` without a binary to launch.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read earlier Nightly, CI and Validate runs
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
      changed: ${{ steps.changed.outputs.changed }}
      retry: ${{ steps.retry.outputs.retry }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
      - id: pin
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The commit to promote: the NEWEST commit on `next`, ahead of `main`, with a successful Validate
      # run. `git rev-list main..next` walks newest-first, so the first match is both the newest
      # candidate and a guaranteed fast-forward. The run list is used only as a SET of validated
      # commits, never for ordering: Validate runs can finish out of order, or be cancelled by a newer
      # push to `next` (a cancelled run never counts). per_page=100 bounds the lookback.
      - name: Find the newest validated commit on next
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code origin refs/heads/next >/dev/null; then
            echo 'No next branch yet; nothing to promote.'
            echo 'sha=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin +refs/heads/next:refs/remotes/origin/next +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor refs/remotes/origin/main refs/remotes/origin/next; then
            echo "::error::main is not an ancestor of next; the branches have diverged. Promotion needs a human."
            exit 1
          fi
          ahead=$(git rev-list refs/remotes/origin/main..refs/remotes/origin/next)
          if [ -z "$ahead" ]; then
            echo "main is level with next; nothing to promote."
            echo 'sha=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          validated=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/validate.yml/runs?branch=next&status=success&event=push&per_page=100" \
            --jq '.workflow_runs[].head_sha' | sort -u)
          candidate=''
          for sha in $ahead; do
            if grep -qxF "$sha" <<<"$validated"; then
              candidate="$sha"
              break
            fi
          done
          if [ -z "$candidate" ]; then
            echo "$(wc -w <<<"$ahead") commit(s) on next ahead of main, none validated yet; nothing to promote."
          else
            echo "Promoting $candidate ($(git log -1 --format='%s' "$candidate"))"
          fi
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"

      # Whether the last finished Nightly failed: the npm edge publish then reruns tonight, completing a
      # graph it may have left partly published (its publisher skips what is already there).
      - id: retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "success"')
          if [ "$last" = success ]; then echo 'retry=false' >> "$GITHUB_OUTPUT"; else echo 'retry=true' >> "$GITHUB_OUTPUT"; fi
          echo "Last finished Nightly: ${last}."

      # Whether the health signals are worth running: a push to develop since the last successful
      # Nightly. Push time comes from CI's push-triggered runs, which is exact; commit dates are not.
      - id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'Manual run: running every health signal.'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')
          if [ -z "$last" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pushes=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?branch=develop&event=push&created=%3E${last}&per_page=1" \
            --jq '.total_count')
          if [ "${pushes:-0}" -gt 0 ]; then
            echo "${pushes} push(es) to develop since the last successful Nightly (${last})."
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo "No push to develop since the last successful Nightly (${last}); health signals skip."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  # Fast-forwards main to the validated candidate, with the promotion App's token: the built-in token
  # cannot update .github/workflows/ files. Without the App's secrets it falls back to the built-in
  # token, which then cannot promote workflow changes. The ruleset on main independently requires the
  # candidate's `Validated` check, which it carries from its run on `next`.
  promote:
    name: Promote · main
    needs: resolve
    if: ${{ needs.resolve.outputs.candidate != '' }}
    runs-on: ubuntu-latest
    outputs:
      advanced: ${{ steps.push.outputs.advanced }}
    permissions:
      contents: write # push refs/heads/main when falling back to the built-in token
    steps:
      - name: Check for the promotion App
        id: app
        env:
          APP_ID: ${{ secrets.PROMOTE_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::PROMOTE_APP_ID is not set; pushing with the built-in token, which cannot promote workflow changes.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Mint the promotion token
        id: app-token
        if: ${{ steps.app.outputs.configured == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PROMOTE_APP_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - name: Fast-forward main to the validated commit
        id: push
        env:
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
        run: bash scripts/fast-forward-branch.sh main "$CANDIDATE"

  # What `edge` should be tonight: main's commit (after any promotion above), under the version both
  # registries publish it as, and which registries to publish to. Runs whether or not a promotion
  # happened, so a failed or partial publish from an earlier night is completed.
  #
  # crates.io is probed (flight-sdk uploads last, so its presence means the graph landed). npm is NOT
  # probed: its publisher completes a partial graph package by package, and a probe of one package
  # could report "published" for a half-published graph and skip it forever. So npm runs on any new
  # promotion, any crates.io publish, any manual run, and after any failed Nightly.
  edge-version:
    name: Publish · resolve edge
    needs: [resolve, promote]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.promote.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read tests.yml conclusions for main's commit
    outputs:
      crates: ${{ steps.check.outputs.crates }}
      npm: ${{ steps.check.outputs.npm }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ADVANCED: ${{ needs.promote.outputs.advanced }}
          RETRY: ${{ needs.resolve.outputs.retry }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(npx tsx scripts/edge-version.ts main | sed -n 's/^version=//p')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # main receives only validated commits, but a hand push skips that. Re-prove CI for this
          # exact commit, as the npm edge publish and Release do; no run is never green.
          successes=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?head_sha=${sha}" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "${successes:-0}" -eq 0 ]; then
            echo "::error::main is at ${sha}, which has no successful CI run; refusing to publish it as edge."
            exit 1
          fi

          # crates.io asks API clients to identify themselves.
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'flighthq-nightly (github.com/flighthq/flight)' \
            "https://crates.io/api/v1/crates/flight-sdk/${version}")
          case "$status" in
            200) crates=false ;;
            404) crates=true ;;
            *) echo "::error::crates.io answered HTTP $status for flight-sdk ${version}"; exit 1 ;;
          esac
          if [ "$ADVANCED" = true ] || [ "$crates" = true ] || [ "$RETRY" = true ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            npm=true
          else
            npm=false
          fi
          echo "edge ${version} (${sha}): crates.io publish=${crates}, npm publish=${npm}"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          echo "npm=$npm" >> "$GITHUB_OUTPUT"

  # crates.io first: it is the slow, rate-limited half (~2h for the graph), and if it fails, npm is not
  # published, so a version never exists on one registry without the other. A partial upload is
  # completed the next night (crates already up are skipped as "already exists").
  crates-edge:
    name: Publish · crates.io edge
    needs: edge-version
    if: ${{ needs.edge-version.outputs.crates == 'true' }}
    uses: ./.github/workflows/rust-publish.yml
    with:
      ref: ${{ needs.edge-version.outputs.sha }}
      version: ${{ needs.edge-version.outputs.version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Then npm, once crates.io has the version (published just now, or already).
  npm-edge:
    name: Publish · npm edge
    needs: [edge-version, crates-edge]
    if: >-
      ${{ !cancelled() && needs.edge-version.result == 'success' && needs.edge-version.outputs.npm == 'true' && (needs.crates-edge.result == 'success' || needs.edge-version.outputs.crates == 'false') }}


    permissions:
      contents: read
      actions: read # edge-publish.yml re-reads tests.yml conclusions for the sha
      id-token: write # npm provenance
    uses: ./.github/workflows/edge-publish.yml
    with:
      sha: ${{ needs.edge-version.outputs.sha }}
      promote_run_id: ${{ github.run_id }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      FLIGHT_COMPILER_DISPATCH_TOKEN: ${{ secrets.FLIGHT_COMPILER_DISPATCH_TOKEN }}

  coverage:
    name: TypeScript · coverage
    needs: resolve
    if: ${{ needs.resolve.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: ./.github/actions/setup-playwright
      - run: npm run test:coverage

  # The shipping bundle size: every dedicated tools/size fixture built through terser, failing when
  # one exceeds its pin in tools/size/size.baseline.json. Examples are demonstrations and may import
  # whole-store conveniences, so they are deliberately not the cost contract. It runs here rather
  # than per-PR because the terser leg is not worth adding to every push for a number that moves rarely.
  #
  # Like every job here it is a health signal and blocks no promotion — so moving it off the PR path
  # means shipping size is no longer enforced before a commit reaches main. That is deliberate: the
  # pin's own remedy (`size:minified:baseline`) erases whatever the gate objected to, so a red gate
  # mostly bought a rewritten pin. Catching it nightly and deciding costs a day and keeps the record.
  size-minified:
    name: TypeScript · bundle size (minified)
    needs: resolve
    if: ${{ needs.resolve.outputs.changed == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run size:minified

  api:
    name: TypeScript · API generation
    needs: resolve
    if: ${{ needs.resolve.outputs.changed == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run api
      - run: npm run api:json

  # Conformance and the Host platform probes live in their own files so each stays runnable by hand.
  conformance:
    name: Conformance
    needs: resolve
    if: ${{ needs.resolve.outputs.changed == 'true' }}
    uses: ./.github/workflows/conformance.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  # Advisory: a platform failure is a warning in the Host job's summary, never a failed Nightly.
  host:
    name: Host backends
    needs: resolve
    if: ${{ needs.resolve.outputs.changed == 'true' }}
    uses: ./.github/workflows/host-matrix.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  # Routes the red. A scheduled run has no author watching it, so without this its failures land
  # nowhere — which is not hypothetical: `coverage` and `api` ran unrouted for their whole existence,
  # and a signal nobody receives is indistinguishable from a signal that never fired.
  #
  # ★ IT DEDUPLICATES, and that is the difference between a route and a nuisance. A job that opens a
  # fresh issue every night turns one persistent failure into thirty issues a month, and the reader
  # mutes the label — the same death as never routing at all. Each failing job maps to a STABLE
  # TITLE, and an already-open issue with that title gets a comment instead of a duplicate. So a
  # standing failure is one issue that accumulates run links, and its comment count is how long it
  # has been broken.
  #
  # It deliberately does NOT auto-close on a later green: closing an issue somebody may be
  # investigating is a worse failure than leaving it open, and a fixed failure stops accumulating
  # comments, which is the readable signal anyway.
  #
  # `if: failure()` fires when a needed job failed; the per-job `result` check below is what keeps a
  # green job from being named in the report.
  report-failure:
    name: Route failures
    needs: [resolve, promote, edge-version, crates-edge, npm-edge, coverage, api, conformance]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      # The only privilege this workflow needs beyond read. No secret and no external service: the
      # automatic GITHUB_TOKEN carries it, which is why this route works in a fork-free scheduled run.
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v5
      - name: Open or update one issue per failing job
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          API_RESULT: ${{ needs.api.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          EDGE_VERSION_RESULT: ${{ needs.edge-version.result }}
          CRATES_EDGE_RESULT: ${{ needs.crates-edge.result }}
          NPM_EDGE_RESULT: ${{ needs.npm-edge.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
        run: |
          set -euo pipefail
          route() {
            job="$1"; result="$2"
            # Only a real failure routes. `skipped` and `cancelled` are not defects, and routing them
            # is how a route trains its reader to ignore it.
            [ "$result" = "failure" ] || return 0
            title="Nightly failure: $job"
            # Dedup key is the exact title. `--search` is a fuzzy match, so the jq filter re-checks
            # equality — otherwise "Nightly failure: api" would match "Nightly failure: api-extras"
            # and a second job's red would be filed as a comment on the first job's issue.
            existing=$(gh issue list --state open --search "\"$title\" in:title" \
              --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Still failing — $RUN_URL"
              echo "$job: commented on #$existing"
            else
              gh issue create --title "$title" --body \
          "The nightly \`$job\` job failed.

          First observed: $RUN_URL

          This issue is reused for every later failure of the same job, so the comment count is how long it has been red. It is not closed automatically — a green run simply stops adding comments."
              echo "$job: opened a new issue"
            fi
          }
          route "resolve" "$RESOLVE_RESULT"
          route "coverage" "$COVERAGE_RESULT"
          route "api" "$API_RESULT"
          route "promote" "$PROMOTE_RESULT"
          route "edge-version" "$EDGE_VERSION_RESULT"
          route "crates-edge" "$CRATES_EDGE_RESULT"
          route "npm-edge" "$NPM_EDGE_RESULT"
          route "conformance" "$CONFORMANCE_RESULT"
