name: Nightly quality

# Per-PR CI (tests.yml) already gates the TypeScript build/test/quality/size and render
# smoke/parity legs on every PR — so nightly does NOT repeat them. Nightly holds only work
# that does not belong on the PR path: full coverage thresholds and API-surface generation.
#
# Nightly does NOT own promotion to main — promote.yml does, triggered per-commit by CI going
# green. Promotion used to live here so it could inherit the coverage + api gates, but that
# coupling stalled main for reasons unrelated to whether the code works, and pinning develop's
# tip once a day meant a red tip discarded that day's green commits entirely. The jobs below are
# health signals on develop; they gate nothing.
#
# The `resolve` job still pins develop's tip once so every quality job tests exactly the same
# commit — scheduled workflows otherwise check out the default branch, which is not what nightly
# is meant to test.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  resolve:
    name: Pin develop
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - id: pin
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  coverage:
    name: Coverage thresholds
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:coverage

  api:
    name: API generation
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run api
      - run: npm run api:json
