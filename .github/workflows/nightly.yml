name: Nightly quality

# Per-PR CI (tests.yml) already gates the TypeScript build/test/quality and render smoke/parity
# legs on every PR — so nightly does NOT repeat them. Nightly holds only work that does not belong
# on the PR path: full coverage thresholds, API-surface generation, and the minified bundle size.
#
# Size is split across the two paths on cost. Per-PR runs `npm run size`, an unminified esbuild
# sweep that finishes in about a minute and reports advisory tree-shaking deltas. The terser-minified
# sweep — the number that is actually shipped — takes roughly ten minutes and runs here.
#
# Nightly does NOT own promotion to main — promote.yml does, triggered per-commit by CI going
# green. Promotion used to live here so it could inherit the coverage + api gates, but that
# coupling stalled main for reasons unrelated to whether the code works, and pinning develop's
# tip once a day meant a red tip discarded that day's green commits entirely. The jobs below are
# health signals on develop; they gate nothing.
#
# The `resolve` job still pins develop's tip once so every quality job tests exactly the same
# commit — scheduled workflows otherwise check out the default branch, which is not what nightly
# is meant to test.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# Electron's postinstall downloads a ~100MB prebuilt binary from GitHub releases on the critical path of
# every `npm ci`. NOTHING IN CI LAUNCHES ELECTRON: the only scripts that do are electron:gallery*,
# dev:examples:electron and the *-harness pair, none of which any job here runs. The build matrix targets
# tools/functional and @flighthq/examples (the WEB runner) — both plain `vite build` — and every capture
# leg drives Playwright chromium, not Electron.
#
# Skipping the download still installs the package and its TYPES, which the build does need:
# tsconfig.build.json includes packages/host-electron, so typechecking resolves electron's declarations.
# Only actually launching Electron needs the platform binary, and no job here does.
#
# Set here rather than in .npmrc on purpose: a repo-wide setting would leave a developer's
# `npm run electron:gallery` without a binary to launch.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  resolve:
    name: Pin develop
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - id: pin
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  coverage:
    name: Coverage thresholds
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:coverage

  # The shipping bundle size: every case built through terser, failing when one exceeds its pin in
  # tools/size/size.baseline.json. It runs here rather than per-PR because a ~10-minute leg on every
  # push is not worth the latency for a number that moves rarely.
  #
  # Like every job here it is a health signal and blocks no promotion — so moving it off the PR path
  # means shipping size is no longer enforced before a commit reaches main. That is deliberate: the
  # pin's own remedy (`size:minified:baseline`) erases whatever the gate objected to, so a red gate
  # mostly bought a rewritten pin. Catching it nightly and deciding costs a day and keeps the record.
  size-minified:
    name: Bundle size (minified)
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run size:minified

  api:
    name: API generation
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run api
      - run: npm run api:json
