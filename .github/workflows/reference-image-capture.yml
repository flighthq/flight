# Captures the cells one outstanding oracle request names and uploads the candidate bundle.
# agents/render-reference-image-repository.md §7 step 2.
#
# ★★ THIS WORKFLOW IS UNTRUSTED-CODE EXECUTION AND HOLDS NO CROSS-REPOSITORY CREDENTIAL.
# It checks out and builds a commissioned Flight commit, then current capture tooling serves that build's
# static output — whoever can land a request can still run arbitrary code through install/build scripts in
# this job. `permissions` is therefore read-only on contents and nothing else, and there is no secret in this
# file. The dispatch to `flight-reference-images` lives in `reference-image-bridge.yml`, which never executes
# this checkout. §7's credential boundary exists so that a commissioned source commit cannot read the
# credential able to rewrite the store it is measured against; splitting it across two workflows is what
# enforces it, not a convention anyone has to remember.
#
# ★ THE TRIGGER IS EVERY PUSH TO THE TRUNK, DELIBERATELY, AND THAT REPLACED A PATH FILTER THAT KEPT
# SILENTLY MISSING COMMISSIONS. A path filter answers "did the queue change in this push"; the body
# answers "what is outstanding now". Those are different questions, and three separate pushes ran no
# capture because a fix landed under `scripts/` or under the sibling workflow file rather than under
# `reference-image-requests/`. Each miss looked like success: no run, no error, nothing in the run list.
# The body is the queue's only reader, so the trigger now simply asks it on every push. That is only
# affordable because the build is gated on there being work (below) — an empty queue is a checkout and
# an `npm ci`.
#
# ★ NOT `pull_request_target`, AND NOT A FORK TRIGGER. Both would hand a commissioned commit a token with
# write scope on this repository. The trigger is a push to the trunk — work that has already landed — plus
# a manual dispatch for re-running one request. That is the same boundary §7 names: "the user's normal
# merge/push is the boundary at which remote automation can act."
name: Reference Images · Capture

# ★ THE TRIGGER AND THE BODY MUST AGREE ABOUT WHAT THE QUEUE IS. The body processes every OUTSTANDING
# request (§5), so a request can be outstanding while nothing re-triggers a run for it — which is exactly
# what happened once the queue-enumeration fix landed: the request was still pending, the workflow was
# fixed, and no push touched `reference-image-requests/**` again, so nothing ran. The workflow files are therefore
# part of the trigger too: a fix to this pipeline tests itself against the live queue. That is cheap by
# construction — with an empty queue the job installs dependencies, finds nothing outstanding, and exits.
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      request:
        # Optional: omit it to process the whole outstanding queue, which is the manual equivalent of what
        # a push does. Requiring a path made "re-run the queue" impossible without inventing a commit.
        description: 'One reference-image-requests/<id>.json, or leave blank for every outstanding request'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One capture per request at a time. Two concurrent runs of the same request would upload two bundles
  # with the same request hash and different artifact digests, and intake could not tell which was current.
  group: reference-image-capture-${{ github.event.inputs.request || github.sha }}
  cancel-in-progress: false

jobs:
  # Enumerating is its own job so the capture can be a MATRIX over requests. That matters for more than
  # tidiness: intake extracts one artifact and reads `candidate.json` at its ROOT, so an archive can hold
  # exactly one request's candidate. One artifact per request is therefore the consumer's contract, not a
  # preference — and a matrix additionally isolates a failing capture to its own request rather than
  # letting it block a sibling's PR.
  requests:
    name: Reference Images · Requests
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.queue.outputs.list }}
      any: ${{ steps.queue.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: queue
        run: |
          if [ -n "${{ github.event.inputs.request }}" ]; then
            stems="$(basename "${{ github.event.inputs.request }}" .json)"
          else
            stems=$(ls reference-image-requests/*.json 2>/dev/null | xargs -r -n1 basename | sed 's/\.json$//' | tr '\n' ' ')
          fi
          list=$(printf '%s' "$stems" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -s -c .)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$list" = '[]' ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "outstanding: $list"

  capture:
    name: Reference Images · Capture · ${{ matrix.request }}
    needs: requests
    if: needs.requests.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        request: ${{ fromJSON(needs.requests.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # First read the trusted request from the push that triggered this CURRENT workflow recipe.
          # Full history is required to prove its commissioned commit is reachable from this push before
          # asking checkout to move; otherwise an unreachable branch-only SHA becomes a generic checkout
          # failure and hides the actual remedy.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Resolve the reviewed build
        id: reviewed-build
        run: |
          set -euo pipefail
          request="reference-image-requests/${{ matrix.request }}.json"
          commit=$(node -e '
            const request = require("./" + process.argv[1]);
            const commits = [...new Set(request.targets?.map((target) => target.build?.commit))];
            if (request.schemaVersion !== 3 || commits.length !== 1 || !/^[0-9a-f]{40}$/.test(commits[0] ?? "")) {
              console.error("the request does not name one reproducible build commit");
              process.exit(1);
            }
            console.log(commits[0]);
          ' "$request")
          if ! git merge-base --is-ancestor "$commit" "${{ github.sha }}"; then
            echo "the request names commit $commit, which is not reachable from this push" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/reference-image-requests"
          cp "$request" "$RUNNER_TEMP/reference-image-requests/${{ matrix.request }}.json"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # ★ TODAY'S INSTRUMENT ON AN OLD SUBJECT. Root remains at github.sha so scope, capture and bundle use
      # the current interfaces this workflow was written against. The reviewed commit is fenced under its
      # own directory and contributes only the product build being measured. A second root checkout used to
      # replace today's tools with old ones: renamed flags that still parsed, or changed output shapes, then
      # failed silently. The explicit path is the version boundary rather than a comment readers must infer.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.reviewed-build.outputs.commit }}
          path: reviewed

      - name: Install current capture instruments
        run: npm ci

      - name: Install reviewed build dependencies
        working-directory: reviewed
        run: npm ci

      - name: Build the reviewed harness
        working-directory: reviewed
        run: |
          npm run build
          npm run build:functional

      - uses: ./.github/actions/setup-playwright

      # ★ THE ENVIRONMENT IDENTITY IS READ FROM `scripts/reference-image-capture-identity.json`, NOT COMPUTED HERE.
      # It is registered in `flight-reference-images` and copied verbatim. This workflow previously derived its own
      # from a runner descriptor, which was wrong twice over: it hashed the runner OS image — measured on
      # 2026-08-15 not to affect output, so two hosts rendering identical pixels got DIFFERENT ids — and a
      # locally-derived value drifts from the registered record the moment either side changes.
      # One producer of one identity. `reference-image-commission` reads the file; nothing here needs to.
      #
      # The descriptor is still ECHOED for the log, so a run that drifts out of the registered environment
      # is visible to a reader rather than silently blessed under an id that no longer describes it.
      - id: environment
        run: |
          chrome=$(npx playwright --version | tr -d ' ')
          echo "registered identity: $(node -p "require('./scripts/reference-image-capture-identity.json').environmentId")"
          echo "observed playwright: $chrome"
          echo "observed chromium:   $(find ~/.cache/ms-playwright -name chrome -type f 2>/dev/null | head -1 | xargs -r -I{} {} --version 2>/dev/null)"

      - name: Capture ${{ matrix.request }}
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/reference-image-requests/${{ matrix.request }}.json"
          # The scope comes from the request through one code path (getOracleRequestCells), so the
          # workflow never re-derives which cells are in scope.
          npx tsx ./scripts/reference-image-commission.ts scope "$request" | while read -r args; do
            npx tsx ./packages/tool-capture/src/bin.ts capture --dir reviewed/tools/functional/dist $args
          done
          npx tsx ./scripts/reference-image-commission.ts bundle "$request" --artifacts .artifacts --stage stage

      # ★ `candidate.json` AND THE PIXEL-DIFFERENCE SIDECAR SIT AT THE ARCHIVE ROOT. Intake opens
      # `<extracted>/candidate.json` directly; a subdirectory reads to it as a missing manifest, which is
      # the failure this replaces. The sidecar preserves review evidence without adding a field to the
      # candidate schema, whose `additionalProperties: false` contract belongs to another repository.
      - name: Assert the archive shape before uploading
        run: |
          dir="stage/${{ matrix.request }}"
          test -f "$dir/candidate.json" || { echo "no candidate.json in $dir" >&2; exit 1; }
          test -f "$dir/request-image-differences.json" || { echo "no request-image-differences.json in $dir" >&2; exit 1; }
          pngs=$(find "$dir/images" -name '*.png' 2>/dev/null | wc -l)
          echo "candidate.json + request-image-differences.json + $pngs image(s):"
          find "$dir" -type f | sed 's/^/  /'
          [ "$pngs" -gt 0 ] || { echo "no image staged for ${{ matrix.request }}" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: reference-image-candidate-${{ matrix.request }}
          path: stage/${{ matrix.request }}
          if-no-files-found: error
          retention-days: 30

      - run: |
          {
            echo "### oracle candidate · ${{ matrix.request }}"
            echo ""
            echo "- reviewed build commit: \`${{ steps.reviewed-build.outputs.commit }}\`"
            echo ""
            echo "#### Candidate"
            echo ""
            echo '```json'
            cat "stage/${{ matrix.request }}/candidate.json"
            echo '```'
            echo ""
            echo "#### Requested-vs-captured pixel evidence"
            echo ""
            echo '```json'
            cat "stage/${{ matrix.request }}/request-image-differences.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
