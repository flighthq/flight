name: Promote

# `main` is a machine-managed known-good pointer, never pushed by hand: it advances only to a
# commit whose CI (tests.yml) actually concluded successfully. This workflow owns that promotion.
#
# Two triggers, one job. `workflow_run` is the fast path — CI finishing green on develop promotes
# within seconds, so main tracks develop continuously. `schedule` is a catch-up for the cases the
# event path can miss: a dropped or undelivered workflow_run, a GitHub incident, or a run whose
# conclusion flipped to green on a later re-run. The catch-up is cheap (one API call plus a push)
# and idempotent, so running it against an already-current main is a no-op, not a failure.
#
# Promotion deliberately does NOT gate on nightly's coverage or api jobs. Those are health signals
# on develop, not release gates; blocking main on a coverage threshold would stall the known-good
# pointer for a reason unrelated to whether the code works. That coupling is not hypothetical: it
# previously lived in nightly.yml as `promote: needs: [resolve, coverage, api]`, and a failing
# coverage threshold silently skipped promotion every night for over a week while every commit on
# develop was green.
#
# THIS FILE MUST LIVE ON THE REPOSITORY'S DEFAULT BRANCH (`main`) OR IT DOES NOT RUN AT ALL.
# GitHub registers and executes `workflow_run` and `schedule` workflows only from the default branch
# — a copy on develop alone is invisible to Actions and never appears in the run list, with no error
# to notice. `branches: [develop]` below filters the TRIGGERING run's branch and is unrelated to
# where this file lives; the two are easy to conflate. So this workflow lands on main first, and
# from there watches develop.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  # One promotion at a time across ALL triggers — the scheduled catch-up and an event-driven run
  # can otherwise resolve the same candidate concurrently and race on the same ref. Never cancel
  # mid-push.
  group: promote-main
  cancel-in-progress: false

jobs:
  promote:
    # workflow_run fires on every CI completion, including failures and cancellations; only a
    # success is worth resolving. schedule/workflow_dispatch carry no triggering run to inspect,
    # so they always proceed — that is what makes the catch-up able to recover a missed event.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Fast-forward main to the newest green commit
    runs-on: ubuntu-latest
    permissions:
      contents: write # push refs/heads/main
      # ★ `write`, NOT `read` — `read` cannot dispatch. Reading tests.yml conclusions needs only
      # `actions: read`, but `gh workflow run` is a WRITE on the actions scope and 403s without this.
      # The failure mode is the one this whole change exists to remove: the promotion would go green,
      # the dispatch would be refused, and edge would silently not publish. A structural test pins it
      # (scripts/edge-publish-dispatch.test.ts) because a permission block is easy to trim later by
      # someone applying least-privilege from the step names alone.
      actions: write # read tests.yml conclusions AND dispatch edge-publish.yml

    steps:
      # fetch-depth: 0 fetches all branches, so both origin/main and origin/develop are present
      # locally — the resolver below needs the range between them, and the remote needs main's
      # tip to validate the push as a fast-forward.
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      # Resolves the NEWEST COMMIT ON DEVELOP, AHEAD OF MAIN, THAT HAS A GREEN CI RUN — not simply
      # the SHA that triggered this run. That one rule absorbs three separate failure modes:
      #
      #   Red tip.        Promotion is not pinned to develop's tip, so a red commit at the head does
      #                   not discard the green commits behind it. It is skipped; the newest green
      #                   ancestor still promotes.
      #   Out-of-order.   CI for an older commit can conclude AFTER a newer one (a manual re-run, or
      #                   slow render legs). Candidates are ranked by commit order via `git rev-list`,
      #                   never by run order, so a late-concluding old run cannot pull main backwards.
      #   Missed event.   Whatever the event path failed to promote is still ahead of main, so the
      #                   next trigger — push or nightly — picks it up with no manual intervention.
      #
      # Absence of a green run is never treated as green: a commit is a candidate only on an explicit
      # success conclusion, so "CI has not started yet" and "CI never ran" both correctly fail to
      # promote rather than defaulting through.
      - name: Resolve the newest green commit ahead of main
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # main must be an ancestor of develop. If it is not, someone pushed directly to main and
          # the branches have genuinely diverged — fail loudly rather than resolve a candidate whose
          # push would either be rejected or, worse, silently discard that commit.
          if ! git merge-base --is-ancestor refs/remotes/origin/main refs/remotes/origin/develop; then
            echo "::error::main has diverged from develop — it is not an ancestor. Promotion needs a human; refusing to guess."
            exit 1
          fi

          # Checked before the API call because it is the steady state for the scheduled catch-up —
          # on a quiet day nothing is ahead of main and there is no need to ask about runs at all.
          # Reported distinctly from "nothing green" below, which is a different situation.
          if [ -z "$(git rev-list refs/remotes/origin/main..refs/remotes/origin/develop)" ]; then
            echo "main is already level with develop at $(git rev-parse --short refs/remotes/origin/main); nothing to promote."
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One API call. Runs come back newest-first, but that ordering is deliberately NOT trusted
          # for ranking (see out-of-order above) — this is used only as a SET of "shas with green CI".
          # Restricted to push events because a pull_request run tests a synthetic merge commit that
          # never exists on develop. per_page=100 bounds the lookback; commits ahead of main sit well
          # inside that in normal operation, and anything missed is caught by the next trigger.
          green_shas=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?branch=develop&status=success&event=push&per_page=100" \
            --jq '.workflow_runs[].head_sha' | sort -u)

          # `git rev-list A..B` walks newest-first and lists only commits ahead of main, so the first
          # match is by construction both the newest candidate and a guaranteed fast-forward.
          candidate=''
          for sha in $(git rev-list refs/remotes/origin/main..refs/remotes/origin/develop); do
            if grep -qxF "$sha" <<<"$green_shas"; then
              candidate="$sha"
              break
            fi
          done

          if [ -z "$candidate" ]; then
            # Legitimate: develop is red, or CI for the commits ahead of main is still in flight.
            # Nothing to promote is not a failure — the next trigger reconsiders.
            echo "$(git rev-list --count refs/remotes/origin/main..refs/remotes/origin/develop) commit(s) ahead of main, none with a green CI run yet; leaving main at $(git rev-parse --short refs/remotes/origin/main)."
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Promoting $candidate ($(git log -1 --format='%s' "$candidate"))"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"

      # Pushes the resolved SHA, never the branch name, so main can only ever land on a commit this
      # workflow verified as green — a develop push mid-run cannot leak in. The push is
      # fast-forward-only by construction; if main moved under us it is rejected rather than
      # overwritten.
      #
      # `advanced` distinguishes a push that MOVED main from one that changed nothing, because the edge
      # dispatch below must fire only on a real promotion. A no-op push is a success at the git level
      # and would otherwise dispatch a publish for a commit already published.
      - name: Fast-forward main to the tested commit
        id: push
        if: ${{ steps.candidate.outputs.sha != '' }}
        env:
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail

          before=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$before" = "$CANDIDATE" ]; then
            echo "main is already at ${CANDIDATE}; nothing pushed."
            echo "advanced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin "${CANDIDATE}:refs/heads/main"

          # Re-read the remote rather than inferring success from the exit code: the dispatch below is
          # a claim that main NOW points at this commit, and that is worth establishing rather than
          # assuming.
          after=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$after" != "$CANDIDATE" ]; then
            echo "::error::pushed ${CANDIDATE} but origin/main is at ${after}; not dispatching an edge publish for a commit main does not point at."
            exit 1
          fi
          echo "main advanced ${before} -> ${CANDIDATE}."
          echo "advanced=true" >> "$GITHUB_OUTPUT"

      # ★ THE PUSH ABOVE STARTS NO WORKFLOW RUN, SO EDGE MUST BE ASKED FOR EXPLICITLY.
      # GitHub does not raise workflow-triggering events for actions taken with the default
      # GITHUB_TOKEN — the recursion guard — so `tests.yml` never fires on main after a promotion and
      # its `edge-publish` job never runs there. Before this step the `edge` dist-tag simply stopped
      # advancing, with no failed run to notice: an absence, not an error.
      #
      # `workflow_dispatch` is the fix because it is one of the two events the guard explicitly exempts
      # (with `repository_dispatch`), so the default token can raise it. `workflow_run` cannot help —
      # it chains off a run, and the missing run is the whole problem — and a PAT or App would trade a
      # long-lived secret for a capability the platform already grants here.
      #
      # ★ A FAILED DISPATCH FAILS THIS JOB. `gh workflow run` is checked under `set -e`, so a dispatch
      # that does not land turns the promotion red. That is the point: the defect being fixed is a
      # silent absence, and a remedy that could itself go silently absent would reproduce it.
      - name: Dispatch the edge publish for the promoted commit
        if: ${{ steps.candidate.outputs.sha != '' && steps.push.outputs.advanced == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail

          gh workflow run edge-publish.yml \
            --ref main \
            --field "sha=${CANDIDATE}" \
            --field "promote_run_id=${GITHUB_RUN_ID}"
          echo "Dispatched edge-publish.yml for ${CANDIDATE}."

      # Correlation, best-effort by design. The dispatch API returns no run id, so the only way back to
      # the run is to look for it. edge-publish.yml puts the candidate in its `run-name`, which makes it
      # findable here. A run that has not appeared yet is NOT a failure — the dispatch already succeeded
      # above, and this step only makes the link clickable from the promotion.
      - name: Link the dispatched edge-publish run
        if: ${{ steps.candidate.outputs.sha != '' && steps.push.outputs.advanced == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          set -uo pipefail

          # ★ `displayTitle`, NOT `title` — `gh run list --json` HAS NO `title` FIELD.
          # Its schema is conclusion, createdAt, databaseId, displayTitle, event, headBranch, headSha,
          # name, number, startedAt, status, updatedAt, url, workflowDatabaseId, workflowName. Asking
          # for `title` makes gh exit non-zero listing the valid fields, so the previous form could
          # never have produced a link — and because this step is `continue-on-error`, it would have
          # failed invisibly every time. A correlation step that silently never correlates is the same
          # class of defect as the missing publish it exists to make visible.
          #
          # `headSha` is matched as well as `displayTitle`: the dispatch runs `--ref main` immediately
          # after main was fast-forwarded to the candidate, so the run's headSha IS the candidate. That
          # is an exact field comparison rather than a substring search over a display string, and the
          # two together mean a run-name change cannot quietly break the link either.
          url=''
          for _ in 1 2 3 4 5 6; do
            url=$(gh run list --workflow=edge-publish.yml --event=workflow_dispatch --limit 20 \
              --json url,displayTitle,headSha \
              --jq "[.[] | select(.headSha == \"${CANDIDATE}\" or (.displayTitle | contains(\"${CANDIDATE}\")))] | .[0].url // empty" || true)
            [ -n "$url" ] && break
            sleep 5
          done

          {
            echo "### Promotion"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| promoted | \`${CANDIDATE}\` |"
            if [ -n "$url" ]; then
              echo "| edge publish | ${url} |"
            else
              echo "| edge publish | dispatched; run not visible yet |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
