name: Host Backends

# The host backends on their real platforms: web, Electron and Tauri on Linux, Capacitor on an Android
# emulator and an iOS simulator. ADVISORY: these depend on things outside this repository (Xcode,
# emulator images, Appium drivers, browsers), and emulators are flaky, so a failure here is a warning,
# never a red build. Each probe retries once before it counts as failed. The deterministic part, the
# host-probe contract tests, runs per push in CI's `Test · TypeScript`.
#
# Run nightly as a job of Nightly (which passes develop's pinned commit as `ref`), or on its own by
# hand — "Run workflow" here — when changing a host backend and wanting an answer before tomorrow.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to probe. Empty means the ref the run was started on.
        required: false
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-matrix-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    name: Host · ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: web
            os: ubuntu-latest
            command: npm run test:host-probe:web
          - host: electron
            os: ubuntu-latest
            command: npm run test:host-probe:electron
          - host: tauri
            os: ubuntu-latest
            command: xvfb-run -a npm run test:host-probe:tauri
          - host: capacitor-android
            os: ubuntu-24.04
            command: HOST_PROBE_CAPACITOR_DEVICE_UDID=emulator-5554 HOST_PROBE_CAPACITOR_PLATFORM=android npm exec --workspace=@flighthq/tool-host-probe -- wdio run wdio.capacitor.conf.ts
          - host: capacitor-ios
            # Capacitor 8's SwiftPM binaries require the Swift toolchain shipped with Xcode 26.
            os: macos-26
            command: HOST_PROBE_CAPACITOR_PLATFORM=ios npm exec --workspace=@flighthq/tool-host-probe -- wdio run wdio.capacitor.conf.ts

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Java for Android
        if: matrix.host == 'capacitor-android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Rust for Tauri
        if: matrix.host == 'tauri'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        if: matrix.host == 'tauri'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            xvfb

      - name: Install Electron display dependency
        if: matrix.host == 'electron'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb

      # Only one matrix cell launches Electron. Avoid downloading its platform binary into the other
      # four fresh runners, while still installing the package and its declarations everywhere.
      - name: Install dependencies
        if: matrix.host != 'electron'
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install dependencies with Electron
        if: matrix.host == 'electron'
        run: npm ci

      - name: Install Chromium for the web probe
        if: matrix.host == 'web'
        uses: ./.github/actions/setup-playwright

      - name: Install the Android Appium driver
        if: matrix.host == 'capacitor-android'
        run: npm exec --workspace=@flighthq/tool-host-probe -- appium driver install uiautomator2

      - name: Install the iOS Appium driver
        if: matrix.host == 'capacitor-ios'
        run: npm exec --workspace=@flighthq/tool-host-probe -- appium driver install xcuitest

      # Build before starting either simulator so native compilation does not contend with the device
      # and Appium for the runner's CPU and memory.
      - name: Build the Android host probe application
        if: matrix.host == 'capacitor-android'
        run: npm exec --workspace=@flighthq/tool-host-probe -- tsx scripts/buildCapacitorApp.ts android

      - name: Build the iOS host probe application
        if: matrix.host == 'capacitor-ios'
        run: npm exec --workspace=@flighthq/tool-host-probe -- tsx scripts/buildCapacitorApp.ts ios

      # Ubuntu hosted runners expose /dev/kvm but do not grant the runner account access by default.
      # Without this rule the emulator falls back to software virtualization and Appium's on-device
      # instrumentation repeatedly dies during startup.
      - name: Enable KVM for the Android emulator
        if: matrix.host == 'capacitor-android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Select and boot an iOS simulator
        if: matrix.host == 'capacitor-ios'
        shell: bash
        run: |
          selection=$(xcrun simctl list devices available -j | node -e "
            const fs = require('node:fs');
            const devices = Object.values(JSON.parse(fs.readFileSync(0, 'utf8')).devices).flat();
            const device = devices.find(({ isAvailable, name }) => isAvailable && name.startsWith('iPhone'));
            if (device === undefined) throw new Error('No available iPhone simulator');
            process.stdout.write(device.udid + '\\t' + device.name);
          ")
          simulator_udid="${selection%%$'\t'*}"
          simulator_name="${selection#*$'\t'}"
          xcrun simctl boot "$simulator_udid" || true
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "HOST_PROBE_CAPACITOR_DEVICE=$simulator_name" >> "$GITHUB_ENV"
          echo "HOST_PROBE_CAPACITOR_DEVICE_UDID=$simulator_udid" >> "$GITHUB_ENV"

      # Advisory, with one retry: the step may fail without failing the job (see the header), and a
      # single flaky launch does not count. The report step at the end turns a failure into a warning.
      - name: Run the host probe
        id: probe
        if: matrix.host != 'capacitor-android'
        continue-on-error: true
        run: ${{ matrix.command }} || { echo '::notice::host probe failed; retrying once'; ${{ matrix.command }}; }
        env:
          HOST_PROBE_ARTIFACT_DIR: ${{ runner.temp }}/host-probe-artifacts

      # The emulator action owns acceleration, startup, and teardown. The APK is already built, so this
      # step only starts Appium and enters the generated Capacitor WebView.
      - name: Run the Android host probe
        id: android-probe
        if: matrix.host == 'capacitor-android'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          HOST_PROBE_ARTIFACT_DIR: ${{ runner.temp }}/host-probe-artifacts
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          script: ${{ matrix.command }} || ${{ matrix.command }}

      # The probe steps are continue-on-error, so `failure()` never fires; diagnostics key on their outcome.
      - name: Capture Android emulator diagnostics
        if: steps.android-probe.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/host-probe-artifacts"
          timeout 30s adb devices -l > "$RUNNER_TEMP/host-probe-artifacts/adb-devices.txt" 2>&1 || true
          timeout 30s adb shell getprop \
            > "$RUNNER_TEMP/host-probe-artifacts/android-properties.txt" 2>&1 || true
          timeout 30s adb shell pm list instrumentation \
            > "$RUNNER_TEMP/host-probe-artifacts/android-instrumentation.txt" 2>&1 || true
          timeout 30s adb logcat -d -v threadtime \
            > "$RUNNER_TEMP/host-probe-artifacts/android-logcat.txt" 2>&1 || true

      - name: Print Appium diagnostic tail
        if: startsWith(matrix.host, 'capacitor-') && (steps.probe.outcome == 'failure' || steps.android-probe.outcome == 'failure')
        run: |
          log="$RUNNER_TEMP/host-probe-artifacts/wdio-appium.log"
          if [ -f "$log" ]; then
            echo '::group::Appium diagnostic tail'
            tail -n 300 "$log"
            echo '::endgroup::'
          fi

      - name: Upload Capacitor diagnostics
        if: startsWith(matrix.host, 'capacitor-') && (steps.probe.outcome == 'failure' || steps.android-probe.outcome == 'failure')
        uses: actions/upload-artifact@v6
        with:
          name: host-matrix-${{ matrix.host }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-probe-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Report
        if: always()
        env:
          REPORT_AREA: Host
          OUTCOMES: ${{ matrix.host }}=${{ matrix.host == 'capacitor-android' && steps.android-probe.outcome || steps.probe.outcome }}
        run: bash scripts/report-hygiene.sh
