name: CI

# The per-commit gate for every PR and for pushes to main/develop. A `changes` job
# (dorny/paths-filter) decides which areas a change touches, so a docs-only PR skips the code
# legs — a fast success that still reports to branch protection, so these checks are safe to
# mark required (unlike a whole-workflow path-skip, which never reports and leaves a required
# check stuck "Expected — Waiting for status"). Docs-only does not mean unchecked: such a
# change still runs the `docs` job.
#
# Nightly (nightly.yml) runs what does NOT belong on the PR path: full coverage thresholds
# and API-surface generation.

on:
  pull_request:
  push:
    branches: [main, develop]
  # Reference Image Check used to be a standalone manually-dispatchable workflow. Keep that operational
  # escape hatch after folding it into CI; a manual CI run deliberately executes the full gate so its
  # success means the same thing as a push-triggered success.
  workflow_dispatch:

# Electron's postinstall downloads a ~100MB prebuilt binary from GitHub releases on the critical path of
# every `npm ci`. NOTHING IN CI LAUNCHES ELECTRON: the only scripts that do are electron:review*,
# dev:examples:electron and the *-harness pair, none of which any job here runs. The build matrix targets
# tools/functional and @flighthq/examples (the WEB runner) — both plain `vite build` — and every capture
# leg drives Playwright chromium, not Electron.
#
# Skipping the download still installs the package and its TYPES, which the build does need:
# tsconfig.build.json includes packages/host-electron, so typechecking resolves electron's declarations.
# Only actually launching Electron needs the platform binary, and no job here does.
#
# Set here rather than in .npmrc on purpose: a repo-wide setting would leave a developer's
# `npm run electron:review` without a binary to launch.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      # Full history: paths-filter needs the merge-base (PRs) or the pre-push commit
      # (pushes) present locally. A shallow clone makes it fetch --deepen in a loop, which
      # is slow and can hit git's transient "shallow file has changed since we read it".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter
        with:
          # Compare pushes against the pushed branch itself (= the commit before the push),
          # not the repository default branch. develop is a long-lived branch; diffing it
          # against main would mark every area changed on every push and the docs-only skip
          # below would never fire. Ignored for pull_request events, which keep the PR base.
          base: ${{ github.ref_name }}
          # All-except filter: a change triggers the code legs unless it only touches docs,
          # so a newly added file type still triggers the legs by default. The exclusion is
          # `agents/**/*.md`, NOT `agents/**` — that directory also holds executable tooling
          # (todo.mjs, scaffold.mjs, bless-queue.mjs) that agents run every session, and a
          # blanket exclusion let real code changes skip every leg.
          #
          # `docs` is a separate output, not an else-branch of `code`: docs:check's subject is
          # exactly what `code` excludes, so gating it behind `code` made it unable to fire on
          # its own subject. See agents/inert-gate-audit.md.
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!agents/**/*.md'
            docs:
              - '**/*.md'
              - 'agents/**'

      # There is no meaningful changed-file range on a manual dispatch. Treat it as an explicit request
      # for the complete CI gate rather than allowing every path-filtered job to skip and reporting a
      # misleading green run that Promote or Release could later mistake for a tested commit.
      - id: scope
        name: Resolve the areas to check
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          FILTER_DOCS: ${{ steps.filter.outputs.docs }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo 'docs=true' >> "$GITHUB_OUTPUT"
          else
            echo "code=$FILTER_CODE" >> "$GITHUB_OUTPUT"
            echo "docs=$FILTER_DOCS" >> "$GITHUB_OUTPUT"
          fi

  # Runs on any docs change, including the docs-only commits that skip every code leg entirely.
  # It deliberately does NOT depend on `code` being false: a gate whose firing hinges on a
  # second output comparing exactly equal to 'false' is the failure mode this job exists to
  # fix. On a mixed code+docs commit `quality` also runs docs:check; that overlap is one cheap
  # job, and it is the safe direction to be wrong in.
  #
  # `check:append-only-ledgers` lives here for exactly the reason `docs` exists as its own output.
  # Its subject is `agents/packages/*/charter.md › Decisions` and `assessment.md › Approved` — .md
  # files, precisely what `code` excludes — so reaching it only through `quality` (which needs
  # `code == 'true'`) meant A COMMIT THAT EDITS ONLY A LEDGER, THE EXACT COMMIT IT EXISTS TO POLICE,
  # RAN IT NOT AT ALL. That is the same mistake this job was created to fix, made one gate later with
  # the warning sitting fifteen lines above. See agents/inert-gate-audit.md.
  docs:
    name: Documentation
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest

    steps:
      # Full history: the ledger check compares each guarded section against its MERGE-BASE with the
      # integration branch, so a depth-1 clone leaves it with nothing to compare and it correctly
      # reports that it verified nothing. `fetch-depth: 0` fetches all branches, so origin/develop
      # and origin/main are both present to resolve a baseline from — the same reason promote.yml
      # gives for its own. Without this line the job runs the check and the check checks nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run docs:check
      - run: npm run check:append-only-ledgers

  # Every code leg gates on `changes` DIRECTLY rather than behind a preflight job. There used to be a
  # `build-check` job (`packages:check && typecheck`) that all of them needed, which made the gate
  # read once — but it put a serial 1m23s in front of every leg on every push, and it computed
  # nothing the `quality` job below does not already compute: `npm run check` runs packages:check and
  # typecheck as its first two gates. Its only real effect was fail-fast, declining to start 14 jobs
  # when the graph does not compile. That trades wall clock on every GREEN push for runner minutes on
  # the rarer RED one, which is the wrong direction here. The cost of removing it is that
  # `needs.changes.outputs.code` is now restated per job; that repetition is the price of the
  # parallelism and is deliberate.
  build:
    name: Build · emit
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      # The single build of the graph per push. Handed to edge-publish and to all six render-test
      # legs, each of which would otherwise run its own full `tsc -b` over all 141 projects to
      # produce byte-identical output — seven redundant compiles. Safe to reuse across the version
      # stamp that edge-publish applies afterwards: nothing inlines the package version at build time
      # (the one manifest read, tool-capture's captureServer, does it at runtime), so dist does not
      # depend on the version in package.json.
      #
      # Tarred first because upload-artifact is slow over many small files, and 141 dist directories
      # are ~76MB of them — as one tarball it is 5.8MB. Uploaded unconditionally rather than gated on
      # the release-channel branches: render-test now consumes it on every push, and a gate would
      # silently starve a consumer rather than fail it.
      - name: Tar dist for the publish and render jobs
        run: tar -czf dist.tgz packages/*/dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist.tgz
          retention-days: 1

  harness-build:
    name: Build · harness · ${{ matrix.label }}
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: functional
            check: build:functional
          - label: examples
            check: build:examples

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run ${{ matrix.check }}

  # Two test legs with different fidelity/speed tradeoffs. `test` is the thorough one: each package runs
  # under its own vitest config, so node packages use the `node` environment and jsdom packages use
  # `jsdom`, each isolated in its own process — correct, but that is 141 serial Vitest startups plus a
  # fresh environment per test file. Fitting a full run gave `node ≈ 4.9s + 0.22s/file` and
  # `jsdom ≈ 2.1s + 0.90s/file` per package: startup dominates the small node packages, per-file DOM
  # construction dominates everything else, and neither is removable without giving up the fidelity
  # this lane exists for. So it is DIVIDED rather than optimised — sharded by package across runners,
  # weight-balanced in scripts/test-shard.ts, with `--shard` scaling off `strategy.job-total` so the
  # matrix length is the only place the shard count is written.
  #
  # The division is NOT free and does not reach 4x: measured, the whole lane is 29m13s serial while one
  # quarter of it is 11m35s, or 40% rather than 25%. The gap is cold cache. Running 141 packages in one
  # process warms the module and page cache for the ones behind it; four runners each start cold over
  # 35, so that warm-up is paid four times. Wall clock still improves ~2.5x, but this lane's runner
  # minutes go UP by roughly 60% — the trade being made deliberately, since wall clock is what gates a
  # push and this lane was the critical path.
  #
  # Folding the 141 configs into one Vitest run via `projects` was measured and rejected: each project
  # gets its own Vite server and therefore its own transform cache, so the boots merely move inside one
  # process and stay serial — and being serial per project, they are paid in full by every shard, which
  # is what makes that shape unshardable. See the header of scripts/test-packages.ts.
  #
  # This is the one lane that runs tool-capture's serialized browser contracts. `test-fast` is the
  # merged run (one shared jsdom env, no isolation) for ordinary unit tests; it excludes tool-capture so
  # local pushes stay fast and don't launch browsers. Both gate PRs; edge-publish gates only on
  # `test-fast`, so a snapshot ships without waiting on the thorough leg.
  test:
    name: Tests · per-package env · ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard runs even when one fails: they test disjoint packages, so a failure in one says
      # nothing about the others and cancelling them costs a whole extra CI round to learn the rest.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # Only the shard holding tool-capture needs a browser, but which shard that is depends on the
      # split, so every shard installs. Chromium is cached by the runner image and this is well off
      # the critical path of the shard that actually uses it.
      - uses: ./.github/actions/setup-playwright
      - run: npm run test:unit -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  test-fast:
    name: Tests · merged jsdom
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  # Runs packages:check and typecheck as its first two gates, which is the whole of what the former
  # `build-check` preflight did — so a graph that does not compile still fails CI here, just without
  # holding every other leg behind it.
  quality:
    name: Quality sweep
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest

    steps:
      # `npm run check` includes `append-only-ledgers:check`, which compares the guarded ledger
      # sections against their MERGE-BASE. A bare checkout is a depth-1 single-branch clone with no
      # second integration ref, so that comparison has nothing to resolve: the gate exits 0 having
      # read nothing. It reported that honestly and still passed, which is the shape of failure that
      # makes a green CI a lie. Full history is what gives the gate a baseline to compare against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run check

  # Advisory, not a gate: `npm run size` always exits 0. It reports which bundles moved against the
  # committed unminified baseline so a reviewer sees the tree-shaking delta in the log. The shipping
  # number is terser-minified and lives in nightly (`size-minified`) — it takes ~10 minutes, and
  # gating on it would push an author to rewrite the pin to clear the red, laundering the regression.
  size:
    name: Bundle size (advisory)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run size

  render-test:
    # One leg per (subject × check) so a failure isolates both which tool and which kind of failure —
    # e.g. parity failing while smoke passes means the backends disagree, not that rendering is broken.
    # Smoke (Tiers 1/2/4) and parity (cross-backend, Tier 3) are environment-independent. The
    # regression check (Tier 5) is environment-coupled to its committed fingerprint baselines, so it is
    # excluded here; run `npm run test:regression` where the baselines were captured.
    #
    # Needs `build` for its dist artifact, not to be sequenced behind it: each leg used to run its own
    # `npm run build`, so a full tsc -b over all 141 projects ran six more times per push to produce
    # output byte-identical to what `build` already emitted and uploaded. Waiting for that job costs
    # nothing net — these legs previously waited on a preflight of comparable length — and the
    # download replaces ~71s of compile per leg.
    name: Render · ${{ matrix.label }}
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: functional · smoke · dom/canvas/webgl
            check: test:functional:smoke
            args: --renderer=dom,canvas,webgl --retries 2
          - label: functional · smoke · webgpu
            check: test:functional:smoke
            args: --renderer=webgpu --parallel 1 --retries 2
          - label: functional · parity
            check: test:functional:parity
            args: --parallel 1 --retries 2
          - label: examples · smoke · dom/canvas/webgl
            check: test:examples:smoke
            args: --renderer=dom,canvas,webgl
          - label: examples · smoke · webgpu
            check: test:examples:smoke
            args: --renderer=webgpu --parallel 1 --retries 2
          - label: examples · parity
            check: test:examples:parity
            args: --parallel 1 --retries 2
          # Screenshot-baseline legs (functional + examples) REMOVED. 4fdfd2a15 wired them as "the one
          # open question" and pre-registered two remedies — pin WebGL's rasterizer, or scope to pinned
          # backends. Both are exhausted: scoping to dom/canvas/webgpu (c7ef40d4e) still drifted, and
          # WebGPU IS pinned to SwiftShader yet six of ten functional diffs were webgpu-only — proving
          # that even a pinned rasterizer does not make a CI-captured golden hash reproduce across
          # machines. The underlying problem: a golden hash was never doing the correctness job — parity
          # and pixel oracles do that. The golden's only job is stability, and a stable reference must
          # be captured where it is checked. capture:*:check stays a LOCAL command for the machine whose
          # hashes it holds; the CI correctness signal comes from smoke and parity above.

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # The parity check imports the SDK from built dist (@flighthq/surface); restoring it is harmless
      # for the smoke check (which resolves packages from source via the dev server). Kept uniform
      # across the matrix rather than gated on the parity legs: the download is seconds, and a gate
      # would make the two checks differ in setup for no measurable gain.
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
      - name: Restore dist from the build job
        run: tar -xzf dist.tgz
      - uses: ./.github/actions/setup-playwright
      # Two knobs, both environment properties rather than code changes, both sized for THIS runner.
      #
      # Worker count: the runner has one SwiftShader adapter, so the default (available parallelism
      # minus headroom, capped) puts six concurrent WebGPU devices on a single software GPU. The legs
      # then overshoot the per-wait budget by ~26% (18901ms against 15000ms) — a contention signature,
      # not a slow scene, since the same scenes verify in ~4-6s when they are not queueing for the
      # adapter. Two workers keeps the runner busy without stacking devices on it.
      #
      # Wait budget: raised because the measured overshoots (18901ms, 17330ms) sit just past the
      # default, so the default leaves no room for a runner that is merely having a bad minute. This
      # buys headroom for contention; it does not paper over a stall, which the reason text still
      # distinguishes by reporting how long the wait actually had.
      #
      # Durable WebGPU rule: every leg that captures WebGPU serializes because this runner has one
      # SwiftShader adapter and concurrent devices can starve frame-capture buffer readback. Smoke
      # has no cross-backend comparison, so it splits: non-WebGPU backends stay parallel while
      # WebGPU runs alone. Parity must compare backends within one run, so the whole leg keeps all
      # renderers together and uses `--parallel 1`.
      - run: npm run ${{ matrix.check }} -- ${{ matrix.args }}
        env:
          FLIGHT_CAPTURE_WORKER_COUNT: 2
          FLIGHT_CAPTURE_TIMEOUT_MS: 45000

  # The blessed-image comparison belongs to the per-commit gate: it is the only tier that can detect a
  # pixel regression against promoted reference bytes. Keeping it in a separate workflow allowed Promote
  # to advance main as soon as tests.yml passed even when this comparison was red or still running.
  #
  # This job is safe on pull requests and forks. Reference packs are public HTTPS reads, the job holds no
  # secret, and its token is explicitly read-only. A zero-comparison run is a failure rather than a green
  # no-op; the lock bounds the capture scope to cells for which reference bytes actually exist.
  reference-image-check:
    name: Reference Images · Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The pack manifest does not yet carry capture provenance, so this must match the frame that was
      # blessed. State it once for scope resolution and comparison rather than allowing either to guess.
      ORACLE_CAPTURE_FRAMES: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # Fetch first: an unresolvable lock fails before the expensive build, and the fetched packs define
      # the exact capture scope used below.
      - name: Fetch and verify the pinned reference packs
        run: npx tsx ./scripts/reference-image-check.ts fetch

      - name: Resolve the capture scope
        id: reference_scope
        run: |
          set -euo pipefail
          scope=$(npx tsx ./scripts/reference-image-check.ts scope --frames "$ORACLE_CAPTURE_FRAMES")
          echo "$scope"
          {
            echo 'lines<<SCOPE'
            echo "$scope"
            echo 'SCOPE'
          } >> "$GITHUB_OUTPUT"

      - name: Build the harness
        run: |
          npm run build
          npm run build:functional

      - uses: ./.github/actions/setup-playwright

      # Echo the registered identity instead of recomputing it. The reference-image repository owns the
      # identity; the observed browser is diagnostic evidence if the hosted runner later drifts from it.
      - name: Echo the registered capture environment
        run: |
          echo "registered identity: $(node -p "require('./scripts/reference-image-capture-identity.json').environmentId")"
          echo "observed playwright: $(npx playwright --version | tr -d ' ')"

      - name: Capture the pinned cells
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.reference_scope.outputs.lines }}" | while read -r args; do
            [ -n "$args" ] || continue
            npx tsx ./packages/tool-capture/src/bin.ts capture $args
          done

      - name: Compare against the blessed references
        run: npx tsx ./scripts/reference-image-check.ts check --frames "$ORACLE_CAPTURE_FRAMES"

      # Green captures are disposable; on failure these bytes are the diagnosis.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reference-image-check-captures
          path: |
            .artifacts/functional/**/screenshot.png
            .artifacts/reference-image-packs/**/*.png
          include-hidden-files: true
          if-no-files-found: warn

  edge-publish:
    # Snapshot ("edge"/"next") publish to npm on every push to a release channel — the continuous
    # counterpart to the tag-triggered stable release (release.yml). Edge is meant to be *available*,
    # so it gates only on the two correctness legs — `build` (it compiles) and `test-fast` (the merged
    # unit-test run, seconds not minutes) — and deliberately NOT on the thorough `test` leg or the
    # health/hygiene legs (`size`, the flaky `render-test` matrix, `harness-build`, `quality`), which
    # still run in parallel as signals but never block an edge build. It never runs on pull_request (no
    # secrets on forks, and only landed code should publish). The version is a prerelease under its own
    # dist-tag, so `latest` is untouched. See agents/packaging.md.
    #
    # ★ DEVELOP ONLY — THE `main` ARM MOVED TO edge-publish.yml AND IS NOT DEAD CODE HERE, IT IS A
    # DUPLICATE. `main` advances only through promote.yml, which pushes with the default GITHUB_TOKEN,
    # and GitHub raises no workflow-triggering event for that token. So this job could never fire on
    # `main` in normal operation — the `edge` tag silently stopped advancing, which is the defect
    # edge-publish.yml now fixes by explicit dispatch. Keeping `refs/heads/main` here would leave a
    # second publisher for the same channel, reachable only by a hand-push to a branch documented as
    # never hand-pushed, racing the dispatched run on a different concurrency key for the same version.
    # `next` (develop) is unaffected: a human pushes develop, so that push does start a run.
    name: Publish · ${{ github.ref_name }} snapshot
    needs: [build, test-fast]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    concurrency:
      # Serialize snapshot publishes per channel; never cancel one mid-publish.
      group: edge-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # edge-version derives the sortable build number from `git rev-list --count`
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          # Writes an .npmrc pointing at public npm and wires NODE_AUTH_TOKEN for the publish.
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # Reuses the `build` job's output instead of rebuilding the graph. See the note on the tar step
      # in `build` for why dist survives the version stamp below.
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
      - name: Restore dist from the build job
        run: tar -xzf dist.tgz

      - name: Compute snapshot version and dist-tag
        id: edge
        run: npx tsx scripts/edge-version.ts >> "$GITHUB_OUTPUT"
      - name: Stamp the graph to the snapshot version
        run: npm run version:packages ${{ steps.edge.outputs.version }}
      - name: Publish snapshot to npm
        run: npm run release -- --no-build --tag ${{ steps.edge.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
