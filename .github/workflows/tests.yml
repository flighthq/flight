name: CI

# The per-commit PRODUCT gate for every PR and for pushes to main/develop: does it build (which
# type-checks every package and its tests), pass its unit/host/Rust tests, render on every backend,
# and package for both registries. A red run
# here means something a user of the SDK would feel. Promote, the snapshot publishes, and branch
# protection all read this workflow, so nothing that is bookkeeping may fail it.
#
# Everything else has a home that cannot turn this red:
#   hygiene.yml  — every push, never fails: the whole-repo typecheck (examples, scripts, functional,
#                  tools — package code is already type-checked by `build`), lint, format (TS + Rust),
#                  clippy, ordering, convention
#                  audits, regenerate/ratchet checks, the scripts and dev-tool suites, advisory size.
#                  Failures surface as warnings and a run summary. The pre-push hook blocks on format.
#   nightly.yml  — once a day on develop's tip: the per-package-environment test shards, render
#                  parity, the reference-image comparison, coverage, minified size, and the crates.io
#                  snapshot of main (crates.io's rate limit makes a full graph take ~2h, too slow and
#                  too noisy to repeat per push; `rust-publish-dry-run` below proves it would publish).
#
# A `changes` job
# (dorny/paths-filter) decides which areas a change touches, so a docs-only PR skips the code
# legs — a fast success that still reports to branch protection, so these checks are safe to
# mark required (unlike a whole-workflow path-skip, which never reports and leaves a required
# check stuck "Expected — Waiting for status").
#
# Documentation checks (docs:check, append-only-ledgers) are principal-facing review tools,
# not CI gates. Run them locally with `npm run docs:check` / `npm run check:append-only-ledgers`.
#
# Nightly (nightly.yml) runs what does NOT belong on the PR path: full coverage thresholds
# and API-surface generation.

on:
  pull_request:
  push:
    branches: [main, develop]
  # A manual CI run deliberately executes the full gate (every path filter forced on), so its success
  # means the same thing as a push-triggered success.
  workflow_dispatch:

# Electron's postinstall downloads a ~100MB prebuilt binary from GitHub releases on the critical path of
# every `npm ci`. NOTHING IN CI LAUNCHES ELECTRON: the only scripts that do are electron:review*,
# dev:examples:electron and the *-harness pair, none of which any job here runs. The build matrix targets
# tools/functional and @flighthq/examples (the WEB runner) — both plain `vite build` — and every capture
# leg drives Playwright chromium, not Electron.
#
# Skipping the download still installs the package and its TYPES, which the build does need:
# tsconfig.build.json includes packages/host-electron, so typechecking resolves electron's declarations.
# Only actually launching Electron needs the platform binary, and no job here does.
#
# Set here rather than in .npmrc on purpose: a repo-wide setting would leave a developer's
# `npm run electron:review` without a binary to launch.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

# A newer push to the same PR supersedes the older run. Pushes to a branch key on their own run id,
# so they never cancel each other: those runs publish snapshots, and a publish must never be cut off.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      # Full history: paths-filter needs the merge-base (PRs) or the pre-push commit
      # (pushes) present locally. A shallow clone makes it fetch --deepen in a loop, which
      # is slow and can hit git's transient "shallow file has changed since we read it".
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter
        with:
          # Compare pushes against the pushed branch itself (= the commit before the push),
          # not the repository default branch. develop is a long-lived branch; diffing it
          # against main would mark every area changed on every push and the docs-only skip
          # below would never fire. Ignored for pull_request events, which keep the PR base.
          base: ${{ github.ref_name }}
          # All-except filter: a change triggers the code legs unless it only touches docs,
          # so a newly added file type still triggers the legs by default. The exclusion is
          # `agents/**/*.md`, NOT `agents/**` — that directory also holds executable tooling
          # (todo.mjs, scaffold.mjs, bless-queue.mjs) that agents run every session, and a
          # blanket exclusion let real code changes skip every leg.
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!agents/**/*.md'
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/publish-crates.sh'
              - 'scripts/version-crates.sh'
              - '.github/workflows/rust-publish.yml'

      # There is no meaningful changed-file range on a manual dispatch. Treat it as an explicit request
      # for the complete CI gate rather than allowing every path-filtered job to skip and reporting a
      # misleading green run that Promote or Release could later mistake for a tested commit.
      - id: scope
        name: Resolve the areas to check
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          FILTER_RUST: ${{ steps.filter.outputs.rust }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo 'rust=true' >> "$GITHUB_OUTPUT"
          else
            echo "code=$FILTER_CODE" >> "$GITHUB_OUTPUT"
            echo "rust=$FILTER_RUST" >> "$GITHUB_OUTPUT"
          fi

  rust-check:
    name: Rust · check
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  rust-test:
    name: Rust · test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Proves the crate graph would publish without uploading it: every publishable crate packages
  # against the others through cargo's local overlay registry. The real upload is nightly, so this is
  # what keeps a broken crate visible on the push that broke it rather than on the next morning.
  rust-publish-dry-run:
    name: Rust · package (dry run)
    # After check and test, mirroring the TypeScript side: verify, then (dry-run) publish. It is also the
    # Rust arc's single verdict for the wasm publish, so it must END IN A DEFINITE STATE rather than be
    # skipped for two different reasons: when no Rust changed (check and test skipped) it succeeds as a
    # no-op; when check or test failed it is skipped, and so is everything waiting on it.
    needs: [rust-check, rust-test]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether there is anything to package
        id: gate
        env:
          CHECK_RESULT: ${{ needs.rust-check.result }}
          TEST_RESULT: ${{ needs.rust-test.result }}
        run: |
          if [ "$CHECK_RESULT" = skipped ] && [ "$TEST_RESULT" = skipped ]; then
            echo "No Rust changed in this push; nothing to package."
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: ${{ steps.gate.outputs.run == 'true' }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.gate.outputs.run == 'true' }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.gate.outputs.run == 'true' }}
      - if: ${{ steps.gate.outputs.run == 'true' }}
        run: cargo publish --workspace --dry-run --no-verify

  # Every code leg gates on `changes` DIRECTLY rather than behind a preflight job. There used to be a
  # `build-check` job (`packages:check && typecheck`) that all of them needed, but it put a serial
  # 1m23s in front of every leg on every push. Its only real effect was fail-fast, declining to start
  # the other jobs when the graph does not compile — trading wall clock on every GREEN push for runner
  # minutes on the rarer RED one, the wrong direction here. The jobs that depend on a working build
  # (the publishes) still wait for this one. The cost is that `needs.changes.outputs.code` is restated
  # per job; that repetition is the price of the parallelism and is deliberate.
  build:
    name: TypeScript · build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      # The single build of the graph per push, handed to the npm publish jobs so they do not repeat
      # the full `tsc -b` over all 141 projects. Safe to reuse across the version
      # stamp that edge-publish applies afterwards: nothing inlines the package version at build time
      # (the one manifest read, tool-capture's captureServer, does it at runtime), so dist does not
      # depend on the version in package.json.
      #
      # Tarred first because upload-artifact is slow over many small files, and 141 dist directories
      # are ~76MB of them — as one tarball it is 5.8MB. Uploaded unconditionally rather than gated on
      # the release-channel branch: it is cheap, and a gate that drifted from the publish job's own
      # condition would silently starve it rather than fail it.
      - name: Tar dist for the publish jobs
        run: tar -czf dist.tgz packages/*/dist
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ github.sha }}
          path: dist.tgz
          retention-days: 1

  # The merged unit run: one shared jsdom environment, no per-package isolation. The isolated
  # per-package-environment shards (and tool-capture's browser contracts) run nightly; see nightly.yml.
  test-fast:
    name: TypeScript · unit tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  test-host:
    name: TypeScript · host backend tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run test:host

  # Only the gates that protect what a user installs: a manifest that resolves, imports that resolve
  # through the blessed lanes, no orphaned dist, and license provenance (which must block every run).
  # The convention and bookkeeping gates run in hygiene.yml. Locally, `npm run check` with no env var
  # still runs every gate.
  quality-structure:
    name: Packaging · manifests and license
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run check
        env:
          FLIGHT_CHECK_GATES: >-
            packages:check,module-specifiers:check,license-provenance:check, package-dist-orphans:check,sdk-subpaths:check,export-lanes:check


  edge-publish:
    # Snapshot ("edge"/"next") publish to npm on every push to develop — the continuous counterpart
    # to the tag-triggered stable release (release.yml). It is meant to be *available*, so it gates on
    # the jobs listed at `needs` below and deliberately NOT on the flaky `render-test` matrix, which
    # still runs in parallel but never blocks a snapshot. It never runs on pull_request (no
    # secrets on forks, and only landed code should publish). The version is a prerelease under its own
    # dist-tag, so `latest` is untouched. See agents/packaging.md.
    #
    # ★ DEVELOP ONLY — THE `main` ARM MOVED TO promote.yml (via edge-publish.yml) AND IS NOT DEAD CODE HERE, IT IS A
    # DUPLICATE. `main` advances only through promote.yml, which pushes with the default GITHUB_TOKEN,
    # and GitHub raises no workflow-triggering event for that token. So this job could never fire on
    # `main` in normal operation — the `edge` tag silently stopped advancing, which is the defect
    # Promote now fixes by calling edge-publish.yml once main has moved. Keeping `refs/heads/main` here would leave a
    # second publisher for the same channel, reachable only by a hand-push to a branch documented as
    # never hand-pushed, racing the promotion's publish on a different concurrency key for the same version.
    # `next` (develop) is unaffected: a human pushes develop, so that push does start a run.
    name: Publish · npm next
    # Gated on everything that says the PUBLISHED packages are sound: they compile and emit (build),
    # behave (unit tests, and host tests for the published host-* backends), and package correctly with
    # clean license provenance. Not on render smoke (the flakiest leg) or anything in hygiene.yml.
    needs: [build, test-fast, test-host, quality-structure]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    concurrency:
      # Serialize snapshot publishes per channel; never cancel one mid-publish.
      group: edge-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          # Writes an .npmrc pointing at public npm and wires NODE_AUTH_TOKEN for the publish.
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # Reuses the `build` job's output instead of rebuilding the graph. See the note on the tar step
      # in `build` for why dist survives the version stamp below.
      - uses: actions/download-artifact@v7
        with:
          name: dist-${{ github.sha }}
      - name: Restore dist from the build job
        run: tar -xzf dist.tgz

      - name: Compute snapshot version and dist-tag
        id: edge
        run: npx tsx scripts/edge-version.ts >> "$GITHUB_OUTPUT"
      # Exercise the same cumulative generator stable publication uses. npm has no release-notes
      # field, so the rendered note lives in the run summary rather than inside one package tarball.
      - name: Generate cumulative snapshot release notes
        env:
          SNAPSHOT_VERSION: ${{ steps.edge.outputs.version }}
        run: |
          set -euo pipefail
          npm run release:notes -- "${SNAPSHOT_VERSION}" --through HEAD --output "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md" >> "${GITHUB_STEP_SUMMARY}"
      - name: Stamp the graph to the snapshot version
        run: npm run version:packages ${{ steps.edge.outputs.version }}
      - name: Publish snapshot to npm (excluding wasm)
        run: npm run release -- --no-build --exclude wasm --tag ${{ steps.edge.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # The npm artifact must exist before the downstream port and compiler are asked to release, so
      # this follows the publish rather than running beside it. `flight-snapshot`, NOT
      # `flight-release`: a receiver that has not learned about snapshots must do NOTHING rather than
      # publish a prerelease to `latest`. The action documents that inversion and the 204 caveat.
      - name: Dispatch downstream snapshot releases
        uses: ./.github/actions/dispatch-downstream
        with:
          commit: ${{ github.sha }}
          dist-tag: ${{ steps.edge.outputs.tag }}
          event-type: flight-snapshot
          flight-compiler-token: ${{ secrets.FLIGHT_COMPILER_DISPATCH_TOKEN }}
          version: ${{ steps.edge.outputs.version }}

  wasm-edge-publish:
    name: Publish · npm next (wasm)
    # After both arcs: the npm publish (TypeScript verified and published) and the Rust dry run (the
    # crates these wasm packages compile from verified, or untouched by this push).
    needs: [edge-publish, rust-publish-dry-run]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: wasm-edge-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - run: npm ci
      - run: npm run build:wasm
      - name: Build wasm package dist
        run: |
          npm run build -w @flighthq/bitmap-wasm \
            -w @flighthq/compression-wasm \
            -w @flighthq/physics2d-abi-wasm \
            -w @flighthq/physics3d-abi-wasm
      - name: Compute snapshot version and dist-tag
        id: edge
        run: npx tsx scripts/edge-version.ts >> "$GITHUB_OUTPUT"
      - name: Stamp the graph to the snapshot version
        env:
          EDGE_VERSION: ${{ steps.edge.outputs.version }}
        run: npm run version:packages "${EDGE_VERSION}"
      - name: Publish wasm snapshot to npm
        env:
          EDGE_TAG: ${{ steps.edge.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm run release -- --no-build --tag "${EDGE_TAG}" wasm

  render-test:
    # One leg per (subject × check) so a failure isolates both which tool and which kind of failure —
    # e.g. a WebGPU-only smoke failure points at that backend rather than at rendering as a whole.
    # Smoke (Tiers 1/2/4) runs here; parity (cross-backend, Tier 3) runs nightly. The
    # regression check (Tier 5) is environment-coupled to its committed fingerprint baselines, so it is
    # excluded here; run `npm run test:regression` where the baselines were captured.
    #
    # Starts cold, beside everything else, and does not wait for `build`: smoke captures a Vite-built
    # harness that maps every @flighthq/* import to package SOURCE, so the emitted package dist is
    # never read. (Parity, which imports the SDK from dist, runs nightly and builds it there.) Each leg
    # builds its own harness as a separate step, so a harness that does not build fails that step —
    # visibly not a rendering failure — and a package type error still fails `TypeScript · build`.
    name: Render · ${{ matrix.label }}
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: functional · smoke · dom/canvas/webgl
            harness: functional
            check: test:functional:smoke
            args: --renderer=dom,canvas,webgl --retries 2
          - label: functional · smoke · webgpu
            harness: functional
            check: test:functional:smoke
            args: --renderer=webgpu --parallel 1 --retries 2
          - label: examples · smoke · dom/canvas/webgl
            harness: examples
            check: test:examples:smoke
            args: --renderer=dom,canvas,webgl
          - label: examples · smoke · webgpu
            harness: examples
            check: test:examples:smoke
            args: --renderer=webgpu --parallel 1 --retries 2
          # Screenshot-baseline legs (functional + examples) REMOVED. 4fdfd2a15 wired them as "the one
          # open question" and pre-registered two remedies — pin WebGL's rasterizer, or scope to pinned
          # backends. Both are exhausted: scoping to dom/canvas/webgpu (c7ef40d4e) still drifted, and
          # WebGPU IS pinned to SwiftShader yet six of ten functional diffs were webgpu-only — proving
          # that even a pinned rasterizer does not make a CI-captured golden hash reproduce across
          # machines. The underlying problem: a golden hash was never doing the correctness job — parity
          # and pixel oracles do that. The golden's only job is stability, and a stable reference must
          # be captured where it is checked. capture:*:check stays a LOCAL command for the machine whose
          # hashes it holds; the CI correctness signal comes from smoke above and parity nightly.

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # Built here rather than left to the capture tool's auto-build, so a harness that does not build
      # is reported by this step and never mistaken for a rendering failure.
      - name: Build the ${{ matrix.harness }} harness
        run: npm run build:${{ matrix.harness }}
      - uses: ./.github/actions/setup-playwright
      # Two knobs, both environment properties rather than code changes, both sized for THIS runner.
      #
      # Worker count: the runner has one SwiftShader adapter, so the default (available parallelism
      # minus headroom, capped) puts six concurrent WebGPU devices on a single software GPU. The legs
      # then overshoot the per-wait budget by ~26% (18901ms against 15000ms) — a contention signature,
      # not a slow scene, since the same scenes verify in ~4-6s when they are not queueing for the
      # adapter. Two workers keeps the runner busy without stacking devices on it.
      #
      # Wait budget: raised because the measured overshoots (18901ms, 17330ms) sit just past the
      # default, so the default leaves no room for a runner that is merely having a bad minute. This
      # buys headroom for contention; it does not paper over a stall, which the reason text still
      # distinguishes by reporting how long the wait actually had.
      #
      # Durable WebGPU rule: every leg that captures WebGPU serializes because this runner has one
      # SwiftShader adapter and concurrent devices can starve frame-capture buffer readback. Smoke
      # has no cross-backend comparison, so it splits: non-WebGPU backends stay parallel while
      # WebGPU runs alone.
      - run: npm run ${{ matrix.check }} -- ${{ matrix.args }}
        env:
          FLIGHT_CAPTURE_WORKER_COUNT: 2
          FLIGHT_CAPTURE_TIMEOUT_MS: 45000
