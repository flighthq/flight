name: CI

# The per-commit PRODUCT gate for every PR and every push to develop. Flight is a Rust SDK with a
# TypeScript companion, and this workflow is its pipeline in three stages:
#
#   Test        Rust and TypeScript, each validated by its own tests.
#   Compliance  license provenance across the whole repository — a hard stop, not a style check.
#   Package     every registry's artifact built and validated: npm (TypeScript), wasm, crates.io.
#   Ready for next  one summary verdict over Test, Compliance and Package: the single check the
#               ruleset on `next` requires. CI itself publishes nothing and holds no publish credential.
#
# What happens after, each in its own workflow:
#   develop → CI (Ready for next) → Promote (npm next, `next`) → CI · extended (Ready for main)
#           → Nightly (`main`, edge on crates.io + npm) → tag (latest, via Release)
# `Package · npm` and `Package · wasm` leave their dist as artifacts for Promote to publish unchanged;
# `Package · crates.io` proves on every push that the crates would publish.
#
# Render smoke runs beside them as a product signal but gates no publish. A red run here means
# something a user of the SDK would feel. The `next` promotion, Nightly, the publishes, and branch
# protection all read this workflow, so nothing that is bookkeeping may fail it.
#
# Everything else has a home that cannot turn this red:
#   hygiene.yml  — every push, never fails: the whole-repo typecheck (examples, scripts, functional,
#                  tools — package code is already type-checked by `Package · npm`), lint, format
#                  (TS + Rust), clippy, ordering, convention audits, regenerate/ratchet checks, the
#                  scripts and dev-tool suites, advisory size.
#                  Failures surface as warnings and a run summary. The pre-push hook blocks on format.
#   nightly.yml  — once a day on develop's tip: the per-package-environment test shards, render
#                  parity, the reference-image comparison, coverage, minified size, and the crates.io
#                  snapshot of main (crates.io's rate limit makes a full graph take ~2h, too slow and
#                  too noisy to repeat per push; `Package · crates.io` below proves it would publish).
#
# ★ NO PATH FILTERING. Every job runs on every push, so a green run means every check passed AT THIS
# COMMIT. A filter on "what this push changed" broke that: a push that broke Rust followed by one that
# touched only TypeScript skipped the Rust jobs, went green, and was promoted, published, and taggable
# with Rust still broken underneath. The promotions, the publishes, and Release all read "CI green" as
# "this commit is good", so it has to mean exactly that. Change-scoped speed lives
# in the pre-push hook instead, where it costs nothing in confidence.
#
# Documentation checks (docs:check, append-only-ledgers) are principal-facing review tools,
# not CI gates. Run them locally with `npm run docs:check` / `npm run check:append-only-ledgers`.

on:
  pull_request:
  push:
    # Develop only. Commits are made on develop and reach `next` and `main` only through the
    # promotions, after this workflow passed for them; the promotions, the publishes and Release all
    # look up that develop run by commit, so a run on `next` or `main` would only repeat it. A commit
    # made directly on either has no CI run and is therefore refused by all of them: the intent.
    branches: [develop]
  # A manual run executes the same full gate as a push, so its success means the same thing.
  workflow_dispatch:

# Electron's postinstall downloads a ~100MB prebuilt binary from GitHub releases on the critical path of
# every `npm ci`. NOTHING IN CI LAUNCHES ELECTRON: the only scripts that do are electron:review*,
# dev:examples:electron and the *-harness pair, none of which any job here runs. The build matrix targets
# tools/functional and @flighthq/examples (the WEB runner) — both plain `vite build` — and every capture
# leg drives Playwright chromium, not Electron.
#
# Skipping the download still installs the package and its TYPES, which the build does need:
# tsconfig.build.json includes packages/host-electron, so typechecking resolves electron's declarations.
# Only actually launching Electron needs the platform binary, and no job here does.
#
# Set here rather than in .npmrc on purpose: a repo-wide setting would leave a developer's
# `npm run electron:review` without a binary to launch.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

# A newer push to the same PR supersedes the older run. Pushes to a branch key on their own run id,
# so they never cancel each other: those runs publish snapshots, and a publish must never be cut off.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  rust-test:
    name: Test · Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Compiles every crate (libraries, binaries, tests, examples) before running anything, so a
      # separate `cargo check` or `cargo build` would only repeat that compile.
      - run: cargo test --workspace

  # Two suites, one job: the merged unit run (one shared jsdom environment; the isolated per-package
  # shards and tool-capture's browser contracts run nightly) and the host backends, which run under
  # their own config because they are a different environment, not a second runner for the same tests.
  # Separate steps keep a failure named.
  ts-test:
    name: Test · TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Host backend tests
        run: npm run test:host
      # The host probe's own contract tests: deterministic and ours. The probes on real platforms
      # (emulators, simulators) are advisory and run in Nightly; see host-matrix.yml.
      - name: Host contract
        run: npm run test:host-probe

  # Whole repository, not per package: a design note claiming material came from elsewhere is exactly
  # what this exists to catch, and that note ships in no package. A hard stop beside the tests rather
  # than a hygiene warning, because what it guards is the right to ship at all.
  compliance:
    name: Compliance · license provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run check
        env:
          FLIGHT_CHECK_GATES: license-provenance:check

  # Every leg starts immediately rather than behind a preflight job. There used to be a `build-check`
  # job (`packages:check && typecheck`) that all of them needed, but it put a serial 1m23s in front of
  # every leg on every push. Its only real effect was fail-fast, declining to start the other jobs when
  # the graph does not compile — trading wall clock on every GREEN push for runner minutes on the rarer
  # RED one, the wrong direction here. The publish still waits for every Package job.
  package-npm:
    name: Package · npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # `tsc -b` over every package, tests included, against its dependencies' emitted declarations —
      # what a consumer of the published packages compiles against.
      - name: Build
        run: npm run build
      # The gates that protect what a user installs: manifests that resolve, imports through the
      # blessed lanes, the SDK's subpaths, and no orphaned dist. The convention and bookkeeping gates
      # run in hygiene.yml; locally, `npm run check` with no env var still runs every gate.
      - name: Packaging checks
        run: npm run check
        env:
          FLIGHT_CHECK_GATES: packages:check,module-specifiers:check,package-dist-orphans:check,sdk-subpaths:check,export-lanes:check

      # Handed to Promote, which publishes it unchanged, so it does not repeat the full `tsc -b` over
      # all 141 projects. Safe to reuse across the version stamp Promote applies: nothing inlines the
      # package version at build time (the one manifest read, tool-capture's captureServer, does it at
      # runtime). The four wasm packages are in this build too, compiled against committed type stubs;
      # Promote replaces their dist with `Package · wasm`'s real one.
      #
      # Tarred first because upload-artifact is slow over many small files, and 141 dist directories
      # are ~76MB of them — as one tarball it is 5.8MB. Uploaded unconditionally: it is cheap, and a
      # gate that drifted from Promote's own eligibility rule would silently starve it rather than fail.
      # Kept long enough for Promote to run after a queue or a manual re-run.
      - name: Tar dist for the publish
        run: tar -czf dist.tgz packages/*/dist
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ github.sha }}
          path: dist.tgz
          retention-days: 7

  # Builds and validates every crate's .crate file against the others through cargo's local overlay
  # registry, without uploading. The real crates.io upload is the nightly snapshot of main, so this is
  # what keeps a crate that cannot publish visible on the push that broke it.
  package-crates:
    name: Package · crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace --no-verify

  # The four wasm npm packages are compiled Rust: wasm-pack builds each crate for the wasm32 target —
  # the only job that compiles these crates for the target they ship to — and their npm builds wrap
  # the result. Packaged before anything publishes, so a wasm failure blocks the release instead of
  # leaving a snapshot version on npm without its wasm packages.
  package-wasm:
    name: Package · wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - run: npm ci
      - name: Build the wasm crates
        run: npm run build:wasm
      - name: Build the wasm npm packages
        run: |
          npm run build -w @flighthq/bitmap-wasm \
            -w @flighthq/compression-wasm \
            -w @flighthq/physics2d-abi-wasm \
            -w @flighthq/physics3d-abi-wasm
      - name: Tar wasm dist for the publish
        run: tar -czf wasm-dist.tgz packages/*-wasm/dist
      - uses: actions/upload-artifact@v6
        with:
          name: wasm-dist-${{ github.sha }}
          path: wasm-dist.tgz
          retention-days: 7

  # The verdict that this commit may be promoted to `next`: every Test, Compliance and Package job
  # succeeded. Promote reads it by name; the ruleset on `next` requires it. It always reports (never
  # left "expected" by a skipped dependency) and runs on pull requests too, so renaming or adding a
  # gate job changes only this `needs` list, never the ruleset. Render smoke is not in it: it is a
  # product signal, not a gate for `next`.
  ready-for-next:
    name: Ready for next
    needs: [rust-test, ts-test, compliance, package-npm, package-crates, package-wasm]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::a gate did not succeed (results: $RESULTS)"
              exit 1
            fi
          done
          echo "All gates passed."

  render-test:
    # One leg per (subject × check) so a failure isolates both which tool and which kind of failure —
    # e.g. a WebGPU-only smoke failure points at that backend rather than at rendering as a whole.
    # Every leg here is SMOKE — each scene renders on each backend, is not blank, and passes its own
    # in-page check — so the kind is left out of the names: `Render · functional` covers DOM, Canvas and
    # WebGL, and only the serialized WebGPU leg carries a suffix. The other kinds run in Nightly and
    # are named for theirs: `Render · functional parity`, `Render · reference images`.
    # Smoke (Tiers 1/2/4) runs here; parity (cross-backend, Tier 3) runs nightly. The
    # regression check (Tier 5) is environment-coupled to its committed fingerprint baselines, so it is
    # excluded here; run `npm run test:regression` where the baselines were captured.
    #
    # Starts cold, beside everything else, and does not wait for `build`: smoke captures a Vite-built
    # harness that maps every @flighthq/* import to package SOURCE, so the emitted package dist is
    # never read. (Parity, which imports the SDK from dist, runs nightly and builds it there.) Each leg
    # builds its own harness as a separate step, so a harness that does not build fails that step —
    # visibly not a rendering failure — and a package type error still fails `Package · npm`.
    name: Render · ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: functional
            harness: functional
            check: test:functional:smoke
            args: --renderer=dom,canvas,webgl --retries 2
          - label: functional · webgpu
            harness: functional
            check: test:functional:smoke
            args: --renderer=webgpu --parallel 1 --retries 2
          - label: examples
            harness: examples
            check: test:examples:smoke
            args: --renderer=dom,canvas,webgl
          - label: examples · webgpu
            harness: examples
            check: test:examples:smoke
            args: --renderer=webgpu --parallel 1 --retries 2
          # Screenshot-baseline legs (functional + examples) REMOVED. 4fdfd2a15 wired them as "the one
          # open question" and pre-registered two remedies — pin WebGL's rasterizer, or scope to pinned
          # backends. Both are exhausted: scoping to dom/canvas/webgpu (c7ef40d4e) still drifted, and
          # WebGPU IS pinned to SwiftShader yet six of ten functional diffs were webgpu-only — proving
          # that even a pinned rasterizer does not make a CI-captured golden hash reproduce across
          # machines. The underlying problem: a golden hash was never doing the correctness job — parity
          # and pixel oracles do that. The golden's only job is stability, and a stable reference must
          # be captured where it is checked. capture:*:check stays a LOCAL command for the machine whose
          # hashes it holds; the CI correctness signal comes from smoke above and parity nightly.

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # Built here rather than left to the capture tool's auto-build, so a harness that does not build
      # is reported by this step and never mistaken for a rendering failure.
      - name: Build the ${{ matrix.harness }} harness
        run: npm run build:${{ matrix.harness }}
      - uses: ./.github/actions/setup-playwright
      # Two knobs, both environment properties rather than code changes, both sized for THIS runner.
      #
      # Worker count: the runner has one SwiftShader adapter, so the default (available parallelism
      # minus headroom, capped) puts six concurrent WebGPU devices on a single software GPU. The legs
      # then overshoot the per-wait budget by ~26% (18901ms against 15000ms) — a contention signature,
      # not a slow scene, since the same scenes verify in ~4-6s when they are not queueing for the
      # adapter. Two workers keeps the runner busy without stacking devices on it.
      #
      # Wait budget: raised because the measured overshoots (18901ms, 17330ms) sit just past the
      # default, so the default leaves no room for a runner that is merely having a bad minute. This
      # buys headroom for contention; it does not paper over a stall, which the reason text still
      # distinguishes by reporting how long the wait actually had.
      #
      # Durable WebGPU rule: every leg that captures WebGPU serializes because this runner has one
      # SwiftShader adapter and concurrent devices can starve frame-capture buffer readback. Smoke
      # has no cross-backend comparison, so it splits: non-WebGPU backends stay parallel while
      # WebGPU runs alone.
      - run: npm run ${{ matrix.check }} -- ${{ matrix.args }}
        env:
          FLIGHT_CAPTURE_WORKER_COUNT: 2
          FLIGHT_CAPTURE_TIMEOUT_MS: 45000
