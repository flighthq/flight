name: CI

# The per-commit gate for every PR and for pushes to main/develop. A `changes` job
# (dorny/paths-filter) decides which areas a change touches, so a docs-only PR skips the code
# legs — a fast success that still reports to branch protection, so these checks are safe to
# mark required (unlike a whole-workflow path-skip, which never reports and leaves a required
# check stuck "Expected — Waiting for status"). Docs-only does not mean unchecked: such a
# change still runs the `docs` job.
#
# Nightly (nightly.yml) runs what does NOT belong on the PR path: full coverage thresholds
# and API-surface generation.

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # Full history: paths-filter needs the merge-base (PRs) or the pre-push commit
      # (pushes) present locally. A shallow clone makes it fetch --deepen in a loop, which
      # is slow and can hit git's transient "shallow file has changed since we read it".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Compare pushes against the pushed branch itself (= the commit before the push),
          # not the repository default branch. develop is a long-lived branch; diffing it
          # against main would mark every area changed on every push and the docs-only skip
          # below would never fire. Ignored for pull_request events, which keep the PR base.
          base: ${{ github.ref_name }}
          # All-except filter: a change triggers the code legs unless it only touches docs,
          # so a newly added file type still triggers the legs by default. The exclusion is
          # `agents/**/*.md`, NOT `agents/**` — that directory also holds executable tooling
          # (todo.mjs, scaffold.mjs, bless-queue.mjs) that agents run every session, and a
          # blanket exclusion let real code changes skip every leg.
          #
          # `docs` is a separate output, not an else-branch of `code`: docs:check's subject is
          # exactly what `code` excludes, so gating it behind `code` made it unable to fire on
          # its own subject. See agents/inert-gate-audit.md.
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!agents/**/*.md'
            docs:
              - '**/*.md'
              - 'agents/**'

  # Runs on any docs change, including the docs-only commits that skip `build-check` entirely.
  # It deliberately does NOT depend on `code` being false: a gate whose firing hinges on a
  # second output comparing exactly equal to 'false' is the failure mode this job exists to
  # fix. On a mixed code+docs commit `quality` also runs docs:check; that overlap is one cheap
  # job, and it is the safe direction to be wrong in.
  docs:
    name: Documentation
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run docs:check

  build-check:
    name: Build preflight
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build:check

  # build / test / quality / size / render all `needs: build-check`; when build-check is skipped
  # (docs-only change) they skip with it, so the `code` gate only needs stating once.
  build:
    name: Build & emit
    needs: build-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      # Handed to edge-publish, which would otherwise run a SECOND full `tsc -b` over all 141
      # projects to produce byte-identical output. Safe to reuse across the version stamp that
      # edge-publish applies afterwards: nothing inlines the package version at build time (the one
      # manifest read, tool-capture's captureServer, does it at runtime), so dist does not depend on
      # the version in package.json.
      #
      # Tarred first because upload-artifact is slow over many small files, and 141 dist directories
      # are ~76MB of them — as one tarball it is 5.8MB. Uploaded unconditionally rather than gated on
      # the release-channel branches: it costs a few seconds on a job that is never the critical path
      # (test and render-test are), and a gate would silently starve any future consumer.
      - name: Tar dist for the publish job
        run: tar -czf dist.tgz packages/*/dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist.tgz
          retention-days: 1

  harness-build:
    name: Harness build · ${{ matrix.label }}
    needs: build-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: functional
            check: build:functional
          - label: examples
            check: build:examples

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run ${{ matrix.check }}

  # Two test legs with different fidelity/speed tradeoffs. `test` is the thorough one: each package runs
  # under its own vitest config, so node packages use the `node` environment and jsdom packages use
  # `jsdom`, each isolated in its own process — correct, but minutes long. This is the one lane that
  # runs tool-capture's serialized browser contracts. `test-fast` is the merged run (one shared jsdom
  # env, no isolation) for ordinary unit tests; it excludes tool-capture so local pushes stay fast and
  # don't launch browsers. Both gate PRs; edge-publish gates only on `test-fast`, so a snapshot ships
  # without waiting on the thorough leg.
  test:
    name: TypeScript tests · isolated (per-package env)
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:unit

  test-fast:
    name: TypeScript tests · fast (merged jsdom)
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  quality:
    name: TypeScript quality
    needs: build-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run check

  size:
    name: Bundle size
    needs: build-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run size

  render-test:
    # One leg per (subject × check) so a failure isolates both which tool and which kind of failure —
    # e.g. parity failing while smoke passes means the backends disagree, not that rendering is broken.
    # Environment-independent checks only: smoke (Tiers 1/2/4) and parity (cross-backend, Tier 3). The
    # regression check (Tier 5) is environment-coupled to its committed fingerprint baselines, so it is
    # excluded here; run `npm run test:regression` where the baselines were captured.
    name: Render · ${{ matrix.label }}
    needs: build-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: functional · smoke · dom/canvas/webgl
            check: test:functional:smoke
            args: --renderer=dom,canvas,webgl --retries 2
          - label: functional · smoke · webgpu
            check: test:functional:smoke
            args: --renderer=webgpu --parallel 1 --retries 2
          - label: functional · parity
            check: test:functional:parity
            args: --parallel 1 --retries 2
          - label: examples · smoke · dom/canvas/webgl
            check: test:examples:smoke
            args: --renderer=dom,canvas,webgl
          - label: examples · smoke · webgpu
            check: test:examples:smoke
            args: --renderer=webgpu --parallel 1 --retries 2
          - label: examples · parity
            check: test:examples:parity
            args: --parallel 1 --retries 2

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # The parity check imports the SDK from built dist (@flighthq/surface); building is harmless
      # for the smoke check (which resolves packages from source via the dev server).
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Two knobs, both environment properties rather than code changes, both sized for THIS runner.
      #
      # Worker count: the runner has one SwiftShader adapter, so the default (available parallelism
      # minus headroom, capped) puts six concurrent WebGPU devices on a single software GPU. The legs
      # then overshoot the per-wait budget by ~26% (18901ms against 15000ms) — a contention signature,
      # not a slow scene, since the same scenes verify in ~4-6s when they are not queueing for the
      # adapter. Two workers keeps the runner busy without stacking devices on it.
      #
      # Wait budget: raised because the measured overshoots (18901ms, 17330ms) sit just past the
      # default, so the default leaves no room for a runner that is merely having a bad minute. This
      # buys headroom for contention; it does not paper over a stall, which the reason text still
      # distinguishes by reporting how long the wait actually had.
      #
      # Durable WebGPU rule: every leg that captures WebGPU serializes because this runner has one
      # SwiftShader adapter and concurrent devices can starve frame-capture buffer readback. Smoke
      # has no cross-backend comparison, so it splits: non-WebGPU backends stay parallel while
      # WebGPU runs alone. Parity must compare backends within one run, so the whole leg keeps all
      # renderers together and uses `--parallel 1`.
      - run: npm run ${{ matrix.check }} -- ${{ matrix.args }}
        env:
          FLIGHT_CAPTURE_WORKER_COUNT: 2
          FLIGHT_CAPTURE_TIMEOUT_MS: 45000

  edge-publish:
    # Snapshot ("edge"/"next") publish to npm on every push to a release channel — the continuous
    # counterpart to the tag-triggered stable release (release.yml). Edge is meant to be *available*,
    # so it gates only on the two correctness legs — `build` (it compiles) and `test-fast` (the merged
    # unit-test run, seconds not minutes) — and deliberately NOT on the thorough `test` leg or the
    # health/hygiene legs (`size`, the flaky `render-test` matrix, `harness-build`, `quality`), which
    # still run in parallel as signals but never block an edge build. It never runs on pull_request (no
    # secrets on forks, and only landed code should publish). The version is a prerelease under its own
    # dist-tag (main -> edge, develop -> next), so `latest` is untouched. See agents/packaging.md.
    name: Publish ${{ github.ref_name }} snapshot to npm
    needs: [build, test-fast]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    concurrency:
      # Serialize snapshot publishes per channel; never cancel one mid-publish.
      group: edge-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # edge-version derives the sortable build number from `git rev-list --count`
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Writes an .npmrc pointing at public npm and wires NODE_AUTH_TOKEN for the publish.
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # Reuses the `build` job's output instead of rebuilding the graph. See the note on the tar step
      # in `build` for why dist survives the version stamp below.
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
      - name: Restore dist from the build job
        run: tar -xzf dist.tgz

      - name: Compute snapshot version and dist-tag
        id: edge
        run: npx tsx scripts/edge-version.ts >> "$GITHUB_OUTPUT"
      - name: Stamp the graph to the snapshot version
        run: npm run version:packages ${{ steps.edge.outputs.version }}
      - name: Publish snapshot to npm
        run: npm run release -- --no-build --tag ${{ steps.edge.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
