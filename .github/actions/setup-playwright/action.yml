name: Setup Playwright
description: Install a Playwright browser with binary caching

inputs:
  browser:
    description: Browser to install
    required: false
    default: chromium
  cache:
    description: Whether to restore and save the Playwright browser cache
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Read Playwright version from lockfile
      id: pw-version
      shell: bash
      run: |
        version=$(node -e "
          const lock = require('./package-lock.json');
          const pw = lock.packages?.['node_modules/playwright-core']
                  || lock.dependencies?.['playwright-core'];
          console.log(pw?.version ?? 'unknown');
        ")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browser cache
      id: pw-cache
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-${{ inputs.browser }}

    - name: Install Playwright browser
      if: inputs.cache != 'true' || steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install ${{ inputs.browser }}
