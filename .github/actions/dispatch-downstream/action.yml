name: Dispatch downstream release
description: Ask flight-rs and flight-compiler to release at a version this repo just published to npm

# ONE PLACE THAT OWNS THE PAYLOAD CONTRACT. Three workflows publish @flighthq/* to npm — release.yml
# (stable tags), edge-publish.yml (`edge`, from main) and tests.yml (`next`, from develop) — and each
# must ask the same two downstream repos to release the matching version. Six hand-written `gh api`
# calls would be six chances for the payload to drift out of step with the receivers, which is the one
# failure this contract cannot detect (see the 204 note below). So the call lives here once.
#
# ★ THE DISPATCH API CANNOT TELL YOU THE RECEIVER HEARD YOU. GitHub returns 204 for a well-formed
# dispatch even when the target repository has NO workflow matching the event_type. A missing,
# misnamed, or not-yet-merged receiver is therefore indistinguishable from a working one: the step is
# green and nothing is released. When changing `event-type` or the payload fields, change both
# receivers first and confirm a run actually appears in each downstream repo.
#
# ★ WHY SNAPSHOTS USE A DIFFERENT event_type THAN STABLE RELEASES, AND WHY THAT IS THE SAFE DEFAULT.
# `flight-release` has always meant "publish this as the current release". A receiver written against
# it may reasonably publish to the `latest` dist-tag without reading any tag field. If snapshots were
# dispatched under that same event_type, every push to develop would ask the downstream repos to
# publish a PRERELEASE to `latest` — handing a half-finished version to everyone who installs without
# a tag, dozens of times a day. Sending snapshots as `flight-snapshot` inverts the failure: a receiver
# that has not been taught about snapshots yet matches nothing and does nothing (the 204 above), which
# is a missing release rather than a poisoned `latest`. Add the receiver when ready; until then this
# side is already correct.

inputs:
  commit:
    description: Source commit the release is built from; informational traceability only
    required: true
  dist-tag:
    description: npm dist-tag the downstream artifact must publish under (latest, edge, next)
    required: true
  event-type:
    description: repository_dispatch event_type — flight-release for stable tags, flight-snapshot otherwise
    required: true
  flight-compiler-token:
    description: Token with dispatch access to flighthq/flight-compiler
    required: true
  flight-rs-token:
    description: Token with dispatch access to flighthq/flight-rs
    required: true
  probe-package:
    description: Package read back to confirm the dist-tag really points at `version` before dispatching
    required: false
    default: '@flighthq/sdk'
  version:
    description: Version the downstream repos must release; authoritative for the downstream release
    required: true

runs:
  using: composite
  steps:
    # ★ CONFIRM THE PUBLISH ACTUALLY LANDED ON THIS TAG BEFORE ASKING ANYONE TO MATCH IT.
    # `publish-packages.ts` already reads every package back and exits non-zero if any is not live, so
    # a failed or partial publish fails the job and never reaches this action. ONE PATH ESCAPES THAT:
    # a SUPERSEDED graph. When the dist-tag has already moved to a higher snapshot version (a later
    # run finished first), the publish deliberately uploads nothing, verifies nothing — `expectations`
    # is empty, so there is nothing to verify — and exits 0. Dispatching there would name a version
    # that was never published, and because a receiver MOVES a dist-tag, it would drag the downstream
    # channel BACKWARD to an older version than the SDK's. That is precisely the incoherence this
    # whole dispatch exists to prevent.
    #
    # So the tag is read back and must resolve to exactly the version being dispatched. A mismatch is
    # a normal no-op, not a failure: the run that owns the newer version dispatches it. A tag that
    # cannot be read at all IS a failure, because the publish just claimed it verified this graph.
    - name: Confirm the dist-tag resolves to this version
      id: confirm
      shell: bash
      env:
        DIST_TAG: ${{ inputs.dist-tag }}
        PROBE_PACKAGE: ${{ inputs.probe-package }}
        VERSION: ${{ inputs.version }}
      run: |
        set -uo pipefail
        if ! live=$(npm view "${PROBE_PACKAGE}@${DIST_TAG}" version 2>/dev/null) || [ -z "${live}" ]; then
          echo "::error::cannot read ${PROBE_PACKAGE}@${DIST_TAG} from the registry; refusing to dispatch ${VERSION}"
          exit 1
        fi
        if [ "${live}" != "${VERSION}" ]; then
          echo "::notice::${PROBE_PACKAGE}@${DIST_TAG} is ${live}, not ${VERSION} — this graph was superseded; skipping dispatch"
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "${PROBE_PACKAGE}@${DIST_TAG} is ${VERSION}; dispatching"
        echo "proceed=true" >> "$GITHUB_OUTPUT"

    # ★ EVERY INTERPOLATED VALUE ARRIVES THROUGH `env`, never `${{ }}` inside the script. A value
    # substituted directly into a `run:` block becomes shell SOURCE before bash sees it; through the
    # environment it stays data, and every reference below is quoted so word-splitting cannot
    # reassemble it. Same rule edge-publish.yml documents for its summary step.
    - name: Dispatch downstream releases
      if: steps.confirm.outputs.proceed == 'true'
      shell: bash
      env:
        COMMIT: ${{ inputs.commit }}
        DIST_TAG: ${{ inputs.dist-tag }}
        EVENT_TYPE: ${{ inputs.event-type }}
        FLIGHT_COMPILER_TOKEN: ${{ inputs.flight-compiler-token }}
        FLIGHT_RS_TOKEN: ${{ inputs.flight-rs-token }}
        VERSION: ${{ inputs.version }}
      run: |
        # Deliberately NOT `set -e`: both repos must be attempted even when the first one fails. A
        # bad or expired token for one receiver must not silently skip the other, which is exactly
        # what a fail-fast sequence of two steps would do.
        set -uo pipefail

        dispatch() {
          repo="$1"
          token="$2"
          if GH_TOKEN="${token}" gh api --method POST "repos/flighthq/${repo}/dispatches" \
            --raw-field "event_type=${EVENT_TYPE}" \
            --raw-field "client_payload[version]=${VERSION}" \
            --raw-field "client_payload[commit]=${COMMIT}" \
            --raw-field "client_payload[dist_tag]=${DIST_TAG}"; then
            echo "dispatched ${EVENT_TYPE} to ${repo}: version ${VERSION} under dist-tag ${DIST_TAG}"
            echo "  (a 204 here does NOT prove ${repo} has a workflow listening for ${EVENT_TYPE})"
            return 0
          fi
          echo "::error::failed to dispatch ${EVENT_TYPE} to ${repo} for version ${VERSION}"
          return 1
        }

        status=0
        dispatch flight-rs "${FLIGHT_RS_TOKEN}" || status=1
        dispatch flight-compiler "${FLIGHT_COMPILER_TOKEN}" || status=1
        exit "${status}"
